# Dev mode override: mounts repo source at /app and enables --reload.
# Python changes take effect automatically (uvicorn restarts the worker).
# Static file changes (HTML/JS/CSS) take effect immediately with no restart.
#
# Usage:
#   sudo docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   sudo docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --profile node2
#
# To stop dev mode, go back to the normal compose file:
#   sudo docker compose up -d --force-recreate

x-dev: &dev
  volumes:
    - .:/app
  # watchfiles (uvicorn's reloader) needs this off so it can detect changes
  read_only: false
  environment:
    PYTHONDONTWRITEBYTECODE: "1"

services:
  node-0-me:
    <<: *dev
    environment:
      CONTACC_DEV: "1"
    volumes:
      - .:/app
      - ${CONTACC_DATA_DIR}/node-0-me:/data
    command: sh -c "python -m server.main /data/node_config.json --host 0.0.0.0 --port $$CONTACC_ME_PORT --reload"

  node-0-them:
    <<: *dev
    environment:
      CONTACC_DEV: "1"
    volumes:
      - .:/app
      - ${CONTACC_DATA_DIR}/node-0-them:/data
    command: sh -c "python -m client.main /data/client_config.json --host 0.0.0.0 --port $$CONTACC_THEM_PORT --reload"

