<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>contac</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #111; color: #e0e0e0; min-height: 100vh; }

    /* ── login ── */
    #login-view { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 1.25rem; }
    #login-view h1 { font-size: 2rem; font-weight: 300; letter-spacing: 0.1em; color: #fff; }
    .divider { color: #555; font-size: 0.85rem; }
    .token-row { display: flex; gap: 0.5rem; }

    /* ── chrome ── */
    header { background: #1a1a1a; padding: 0.6rem 1rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a2a; position: sticky; top: 0; z-index: 20; gap: 0.5rem; }
    .header-left  { display: flex; align-items: center; gap: 0.75rem; flex-shrink: 0; }
    .header-right { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
    .logo { font-size: 1.1rem; font-weight: 500; color: #fff; }
    #identity-badge { font-size: 0.75rem; color: #666; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #search-wrap { flex: 1; min-width: 0; }
    #search-input { width: 100%; padding: 0.4rem 0.7rem; border-radius: 4px; border: 1px solid #333; background: #222; color: #e0e0e0; font-size: 0.88rem; outline: none; }
    #search-input:focus { border-color: #4285f4; }

    /* ── layout ── */
    #feed-view { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    #body-wrap { display: flex; flex: 1; overflow: hidden; }

    /* ── sidebar ── */
    #sidebar { width: 200px; flex-shrink: 0; background: #161616; border-right: 1px solid #242424; overflow-y: auto; padding: 0.75rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .sidebar-head { font-size: 0.72rem; color: #555; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.25rem; }
    #tag-list { display: flex; flex-direction: column; gap: 0.25rem; }
    .tag-btn { background: none; border: none; text-align: left; cursor: pointer; padding: 0.3rem 0.5rem; border-radius: 4px; font-size: 0.82rem; color: #888; display: flex; justify-content: space-between; align-items: center; }
    .tag-btn:hover { background: #222; color: #ccc; }
    .tag-btn.active { background: #1e2d4a; color: #6aa3f5; }
    .tag-btn .tc { font-size: 0.72rem; color: #555; }
    .tag-btn.active .tc { color: #4a7abf; }
    #sidebar-empty { font-size: 0.8rem; color: #444; padding: 0.25rem 0.5rem; }
    #clear-tags-btn { font-size: 0.75rem; color: #4285f4; background: none; border: none; cursor: pointer; padding: 0.2rem 0.5rem; text-align: left; }
    #clear-tags-btn:hover { text-decoration: underline; }

    /* ── timeline ── */
    #main-area { flex: 1; overflow-y: auto; padding: 1rem; }
    #timeline { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 0.75rem; }
    #feed-status { font-size: 0.8rem; color: #555; margin-bottom: 0.5rem; max-width: 680px; margin-left: auto; margin-right: auto; }
    .more-row { text-align: center; padding: 1rem; max-width: 680px; margin: 0 auto; }
    .empty { color: #555; text-align: center; padding: 3rem; }
    .empty-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }

    /* ── post card ── */
    .post-card { background: #1e1e1e; border-radius: 8px; padding: 1rem; cursor: pointer; transition: background 0.1s; border: 2px solid transparent; }
    .post-card:hover { background: #232323; }
    .post-card.active-card { border-color: #4285f4; }
    .post-body-preview { font-size: 0.92rem; color: #ccc; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
      display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .post-body-preview.text-only { -webkit-line-clamp: 6; }
    .post-thumbs { display: flex; gap: 4px; margin-top: 0.6rem; overflow-x: auto; padding-bottom: 2px; }
    .post-thumb { width: 100px; height: 100px; object-fit: cover; border-radius: 4px; flex-shrink: 0; background: #2a2a2a; }
    .post-thumb-icon { width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; font-size: 2rem; background: #2a2a2a; border-radius: 4px; flex-shrink: 0; }
    .post-thumb.loading { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
    .post-foot { margin-top: 0.6rem; display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; font-size: 0.76rem; color: #555; }
    .post-date { flex-shrink: 0; }
    .post-comment-count { flex-shrink: 0; }

    /* ── drag highlight ── */
    body.drag-active #main-area { outline: 2px dashed #4285f4; outline-offset: -8px; border-radius: 6px; }

    /* ── overlays ── */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.88); display: flex; align-items: center; justify-content: center; z-index: 50; }
    .modal { background: #1e1e1e; border-radius: 8px; max-width: min(90vw, 720px); width: 100%; max-height: 90vh; overflow: auto; padding: 1.25rem; position: relative; }
    .modal-close { position: absolute; top: 0.6rem; right: 0.75rem; background: none; border: none; color: #aaa; font-size: 1.4rem; cursor: pointer; line-height: 1; }
    .modal-close:hover { color: #fff; }
    .modal h3 { color: #fff; margin-bottom: 1rem; font-weight: 400; }

    /* ── detail ── */
    .modal-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); border: none; color: #aaa; font-size: 1.8rem; cursor: pointer; padding: 0.5rem 0.7rem; border-radius: 4px; line-height: 1; }
    .modal-nav:hover { color: #fff; background: rgba(0,0,0,0.75); }
    #nav-prev { left: -3rem; }
    #nav-next { right: -3rem; }

    /* ── post detail body ── */
    .post-detail-body { font-size: 0.95rem; color: #ddd; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
    .post-detail-body .asset-block { display: block; margin: 0.75rem 0; white-space: normal; }
    .post-detail-body .asset-block img { max-width: 100%; border-radius: 6px; display: block; }
    .post-detail-body .asset-block video { max-width: 100%; border-radius: 6px; display: block; }
    .post-detail-body .asset-block .asset-file { display: inline-flex; align-items: center; gap: 0.5rem; background: #2a2a2a; padding: 0.4rem 0.75rem; border-radius: 4px; font-size: 0.85rem; color: #aaa; text-decoration: none; }
    .post-detail-body .asset-block .asset-file:hover { background: #333; color: #eee; }
    .modal-meta { margin-top: 0.75rem; font-size: 0.85rem; color: #888; }
    .modal-actions { margin-top: 0.75rem; display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    .btn-danger { background: #3a1a1a; color: #e06c6c; }
    .btn-danger:hover { background: #4a1a1a; }
    .edit-body { background: #222; color: #e0e0e0; border: 1px solid #4285f4; border-radius: 4px; padding: 0.6rem; width: 100%; font-size: 0.95rem; resize: vertical; min-height: 100px; outline: none; font-family: inherit; line-height: 1.65; }
    .delete-confirm { display: inline-flex; gap: 0.4rem; align-items: center; }
    .tag-chip { display: inline-block; background: #2a2a2a; color: #aaa; padding: 2px 9px; border-radius: 12px; font-size: 0.75rem; margin: 2px; cursor: pointer; border: none; }
    .tag-chip:hover { background: #1e2d4a; color: #6aa3f5; }
    .tag-chip.active { background: #1e2d4a; color: #6aa3f5; }

    /* ── comments ── */
    .comments { margin-top: 1rem; padding-top: 0.75rem; border-top: 1px solid #2a2a2a; }
    .comments-header { font-size: 0.85rem; color: #777; margin-bottom: 0.75rem; }
    .comment { padding: 0.5rem 0; border-bottom: 1px solid #1a1a1a; }
    .comment:last-of-type { border-bottom: none; }
    .comment-author { font-size: 0.73rem; color: #666; margin-bottom: 0.2rem; }
    .comment-body { font-size: 0.88rem; color: #ccc; white-space: pre-wrap; word-break: break-word; }
    .comment-foot { font-size: 0.72rem; color: #555; margin-top: 0.2rem; display: flex; gap: 0.75rem; }
    .comment-foot button { background: none; border: none; color: #555; cursor: pointer; font-size: 0.72rem; padding: 0; }
    .comment-foot button:hover { color: #aaa; }
    .comment-replies { margin-left: 1rem; padding-left: 0.75rem; border-left: 2px solid #2a2a2a; }
    .reply-banner { background: #1a2a1a; border-radius: 4px; padding: 0.3rem 0.5rem; font-size: 0.78rem; color: #6cbe6c; margin-bottom: 0.4rem; display: flex; justify-content: space-between; }
    .comment-form { margin-top: 0.75rem; }
    .comment-form textarea { background: #222; color: #e0e0e0; border: 1px solid #333; border-radius: 4px; padding: 0.5rem; width: 100%; font-size: 0.88rem; resize: vertical; min-height: 60px; outline: none; font-family: inherit; }
    .comment-form textarea:focus { border-color: #4285f4; }
    .comment-form-footer { display: flex; justify-content: flex-end; margin-top: 0.4rem; }

    /* ── compose / post modal ── */
    #compose-modal { min-width: min(90vw, 560px); }
    #compose-body { background: #222; color: #e0e0e0; border: 1px solid #333; border-radius: 4px; padding: 0.6rem; width: 100%; font-size: 0.95rem; resize: vertical; min-height: 100px; outline: none; font-family: inherit; margin-bottom: 0.75rem; }
    #compose-body:focus { border-color: #4285f4; }
    .drop-zone { border: 2px dashed #444; border-radius: 6px; padding: 1.25rem 1rem; text-align: center; cursor: pointer; color: #777; transition: border-color 0.15s; }
    .drop-zone:hover, .drop-zone.over { border-color: #4285f4; color: #aaa; }
    .drop-zone-icon { font-size: 1.5rem; margin-bottom: 0.25rem; }
    .file-list { margin: 0.6rem 0; max-height: 100px; overflow-y: auto; }
    .file-item { font-size: 0.82rem; padding: 0.2rem 0; color: #aaa; display: flex; justify-content: space-between; }
    .compose-fields { display: flex; flex-direction: column; gap: 0.5rem; margin: 0.6rem 0; }
    .upload-progress { font-size: 0.85rem; color: #aaa; min-height: 1.4em; margin: 0.5rem 0; }
    .progress-item { padding: 0.15rem 0; }
    .progress-ok { color: #6cbe6c; }
    .progress-err { color: #e06c6c; }

    /* ── shared controls ── */
    .btn { padding: 0.42rem 1rem; border: none; border-radius: 4px; cursor: pointer; font-size: 0.88rem; }
    .btn-primary { background: #4285f4; color: #fff; }
    .btn-primary:hover { background: #3a78e8; }
    .btn-muted { background: #2a2a2a; color: #ccc; }
    .btn-muted:hover { background: #333; }
    .btn-sm { padding: 0.3rem 0.7rem; font-size: 0.8rem; }
    input[type=text], input[type=password], input[type=email] { padding: 0.42rem 0.7rem; border-radius: 4px; border: 1px solid #333; background: #222; color: #e0e0e0; font-size: 0.88rem; outline: none; width: 100%; }
    input[type=text]:focus, input[type=password]:focus, input[type=email]:focus { border-color: #4285f4; }
    [hidden] { display: none !important; }

    /* ── setup / unlock ── */
    .setup-card { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .setup-inner { max-width: 420px; width: 100%; }
    .setup-inner h1 { font-size: 1.8rem; font-weight: 300; letter-spacing: 0.1em; color: #fff; margin-bottom: 2rem; text-align: center; }
    .setup-tabs { display: flex; margin-bottom: 1.5rem; border-radius: 6px; overflow: hidden; border: 1px solid #333; }
    .setup-tab { flex: 1; border-radius: 0; border: none; padding: 0.5rem; cursor: pointer; font-size: 0.88rem; transition: background 0.1s; }
    .setup-tab.active { background: #4285f4; color: #fff; }
    .setup-tab:not(.active) { background: #2a2a2a; color: #aaa; }
    .setup-form { display: flex; flex-direction: column; gap: 0.75rem; }
    .setup-error { color: #e06c6c; font-size: 0.85rem; min-height: 1.2em; }

    /* ── responsive ── */
    @media (max-width: 600px) {
      #sidebar { width: 100%; height: auto; flex-direction: row; flex-wrap: wrap; border-right: none; border-bottom: 1px solid #242424; padding: 0.5rem; overflow-x: auto; }
      #body-wrap { flex-direction: column; }
      #tag-list { flex-direction: row; flex-wrap: wrap; }
      .sidebar-head { display: none; }
      #nav-prev { left: 0.25rem; }
      #nav-next { right: 0.25rem; }
    }
  </style>
</head>
<body>

<!-- ── setup (uninitialized) ───────────────────────────────────────────────── -->
<div id="setup-view" hidden>
  <div class="setup-card">
    <div class="setup-inner">
      <h1>contacc</h1>

      <!-- Step 1: token entry -->
      <div id="setup-token-step" class="setup-form">
        <p style="color:#888;font-size:0.9rem;text-align:center">Enter the setup token from your server logs to continue.</p>
        <input type="text" id="setup-token-input" placeholder="Setup token" autocomplete="off" onkeydown="if(event.key==='Enter')acceptSetupToken()">
        <button class="btn btn-primary" onclick="acceptSetupToken()">Continue</button>
        <div class="setup-error" id="setup-token-error"></div>
      </div>

      <!-- Step 2: new / restore (hidden until token entered) -->
      <div id="setup-wizard-step" hidden>
        <div class="setup-tabs">
          <button class="setup-tab active" id="tab-new" onclick="showSetupTab('new')">New Identity</button>
          <button class="setup-tab" id="tab-restore" onclick="showSetupTab('restore')">Restore Backup</button>
        </div>
        <div id="setup-new-form" class="setup-form">
          <input type="email" id="setup-owner-email" placeholder="your@email.com (Google account)">
          <input type="text" id="setup-handle" placeholder="Handle (e.g. alice)" autocomplete="off" autocapitalize="none" oninput="checkHandleAvailability()">
          <div id="setup-handle-status" style="font-size:0.82rem;min-height:1.1em;margin-top:-0.25rem;padding-left:0.1rem"></div>
          <input type="password" id="setup-passphrase" placeholder="Choose a passphrase">
          <input type="password" id="setup-passphrase-confirm" placeholder="Confirm passphrase">
          <button class="btn btn-primary" onclick="doSetupNew()">Create Identity</button>
          <div class="setup-error" id="setup-new-error"></div>
        </div>
        <div id="setup-restore-form" class="setup-form" hidden>
          <div class="drop-zone" onclick="document.getElementById('restore-file-picker').click()">
            <div class="drop-zone-icon">&#x1F4E6;</div>
            <div id="restore-file-label">Select backup .zip file</div>
          </div>
          <input type="file" id="restore-file-picker" accept=".zip" hidden onchange="pickRestoreFile(this)">
          <input type="password" id="restore-passphrase" placeholder="Passphrase">
          <button class="btn btn-primary" onclick="doSetupRestore()">Restore</button>
          <div class="setup-error" id="setup-restore-error"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ── unlock (locked) ─────────────────────────────────────────────────────── -->
<div id="unlock-view" hidden>
  <div class="setup-card">
    <div class="setup-inner">
      <h1>contacc</h1>
      <div class="setup-form">
        <p style="color:#888;font-size:0.9rem;text-align:center">Enter your passphrase to unlock</p>
        <input type="password" id="unlock-passphrase" placeholder="Passphrase" onkeydown="if(event.key==='Enter')doUnlock()">
        <button class="btn btn-primary" onclick="doUnlock()">Unlock</button>
        <div class="setup-error" id="unlock-error"></div>
      </div>
    </div>
  </div>
</div>

<!-- ── login ──────────────────────────────────────────────────────────────── -->
<div id="login-view">
  <h1>contac</h1>
  <button class="btn btn-primary" onclick="loginGoogle()">Sign in with Google</button>
  <span class="divider">— or paste a token —</span>
  <div class="token-row">
    <input type="text" id="token-input" placeholder="Owner or recipient token" style="width:280px">
    <button class="btn btn-primary" onclick="loginWithToken()">Go</button>
  </div>
  <div id="login-error" style="color:#e06c6c;font-size:0.85rem"></div>
</div>

<!-- ── feed ───────────────────────────────────────────────────────────────── -->
<div id="feed-view" hidden>
  <header>
    <div class="header-left">
      <span class="logo">contac</span>
      <span id="identity-badge"></span>
    </div>
    <div id="search-wrap">
      <input type="text" id="search-input" placeholder="Search posts…" oninput="scheduleSearch(this.value)">
    </div>
    <div class="header-right">
      <button id="compose-btn" class="btn btn-primary btn-sm" onclick="openCompose()" hidden>+ Post</button>
      <button id="backup-btn" class="btn btn-muted btn-sm" onclick="downloadBackup()" hidden>Backup</button>
      <a id="client-link" class="btn btn-muted btn-sm" style="text-decoration:none" hidden>Client →</a>
      <button class="btn btn-muted btn-sm" onclick="logout()">Sign out</button>
    </div>
  </header>
  <div id="body-wrap">
    <nav id="sidebar">
      <div class="sidebar-head">Tags</div>
      <div id="tag-list"></div>
      <div id="sidebar-empty" hidden>No tags yet.</div>
      <button id="clear-tags-btn" onclick="clearTagFilter()" hidden>Clear filter</button>
    </nav>
    <div id="main-area">
      <div id="feed-status"></div>
      <div id="timeline"></div>
      <div id="empty-msg" class="empty" hidden>
        <div class="empty-icon">&#x1F4DD;</div>
        <div>No posts yet.</div>
      </div>
      <div class="more-row">
        <button id="load-more-btn" class="btn btn-muted" onclick="loadMore()" hidden>Load more</button>
      </div>
    </div>
  </div>
</div>

<!-- ── detail modal ───────────────────────────────────────────────────────── -->
<div id="detail-overlay" class="overlay" hidden onclick="maybeClose('detail-overlay',event)">
  <div class="modal" id="detail-modal">
    <button class="modal-close" onclick="closeDetail()">&#x2715;</button>
    <button class="modal-nav" id="nav-prev" onclick="navigatePost(-1)" title="Previous (←)">&#x2039;</button>
    <button class="modal-nav" id="nav-next" onclick="navigatePost(1)"  title="Next (→)">&#x203A;</button>
    <div id="detail-body"></div>
  </div>
</div>

<!-- ── compose modal ──────────────────────────────────────────────────────── -->
<div id="compose-overlay" class="overlay" hidden onclick="maybeClose('compose-overlay',event)">
  <div class="modal" id="compose-modal">
    <button class="modal-close" onclick="closeCompose()">&#x2715;</button>
    <h3>New post</h3>
    <textarea id="compose-body" placeholder="What's on your mind?"></textarea>
    <div class="drop-zone" id="drop-zone"
         onclick="document.getElementById('file-picker').click()"
         ondragover="dzOver(event)" ondragleave="dzOut(event)" ondrop="dzDrop(event)">
      <div class="drop-zone-icon">&#x1F4CE;</div>
      <div>Attach files — click or drag here</div>
    </div>
    <input type="file" id="file-picker" multiple hidden onchange="pickFiles(this.files);this.value=''">
    <div class="file-list" id="file-list"></div>
    <div class="compose-fields">
      <input type="text" id="compose-tags" placeholder="Tags — space-separated">
      <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.85rem;color:#aaa;cursor:pointer">
        <input type="checkbox" id="compose-inner-monologue" onchange="toggleInnerMonologue(this)"> Inner monologue (private journal — never shared)
      </label>
      <label id="compose-public-label" style="display:flex;align-items:center;gap:0.5rem;font-size:0.85rem;color:#aaa;cursor:pointer">
        <input type="checkbox" id="compose-public"> Publish (visible to recipients)
      </label>
    </div>
    <div class="upload-progress" id="compose-progress"></div>
    <div style="display:flex;gap:0.5rem;justify-content:flex-end">
      <button class="btn btn-muted" onclick="closeCompose()">Cancel</button>
      <button class="btn btn-primary" id="compose-submit" onclick="submitPost()">Post</button>
    </div>
  </div>
</div>

<script>
// ── state ──────────────────────────────────────────────────────────────────
let TOKEN = null, IS_OWNER = false;
let nextCursor = null, currentSearch = null, searchTimer = null;
let activeTags = new Set();
let allPosts = [];      // flat list for keyboard nav
let currentIdx = -1;
let pendingFiles = [];

// ── auth ───────────────────────────────────────────────────────────────────
function authHeaders() { return {"Authorization": "Bearer " + TOKEN}; }
function storeToken(t) { TOKEN = t; localStorage.setItem("contac_token", t); }

function logout() {
  localStorage.removeItem("contac_token");
  TOKEN = null; IS_OWNER = false;
  showView("login");
}

async function loginGoogle() {
  const r = await fetch("/auth/login?provider=google");
  if (!r.ok) { document.getElementById("login-error").textContent = r.status === 503 ? "Google SSO not configured." : "Login unavailable."; return; }
  window.location.href = (await r.json()).auth_url;
}

async function loginWithToken() {
  const t = document.getElementById("token-input").value.trim();
  if (!t) return;
  TOKEN = t;
  const ok = await tryLoadFeed();
  if (!ok) { TOKEN = null; document.getElementById("login-error").textContent = "Token rejected."; }
  else { storeToken(t); }
}

async function loadIdentity() {
  const r = await fetch("/auth/me", {headers: authHeaders()});
  if (!r.ok) return;
  const d = await r.json();
  IS_OWNER = d.role === "owner";
  document.getElementById("compose-btn").hidden = !IS_OWNER;
  document.getElementById("backup-btn").hidden = !IS_OWNER;
  const badge = document.getElementById("identity-badge");
  const nodeR = await fetch("/node", {headers: authHeaders()});
  const nodeD = nodeR.ok ? await nodeR.json() : {};
  const handlePart = nodeD.handle ? `@${nodeD.handle}` : "";
  const rolePart = d.role === "owner" ? "owner" : (d.display_name || d.identity || "");
  badge.textContent = handlePart ? `${handlePart} · ${rolePart}` : rolePart;
  badge.title = nodeD.node || "";
  const clientLink = document.getElementById("client-link");
  if (window.location.port) {
    clientLink.href = window.location.protocol + "//" + window.location.hostname + ":" + (parseInt(window.location.port) + 1);
    clientLink.hidden = false;
  }
}

// ── views ──────────────────────────────────────────────────────────────────
function showView(name) {
  document.getElementById("setup-view").hidden  = name !== "setup";
  document.getElementById("unlock-view").hidden = name !== "unlock";
  document.getElementById("login-view").hidden  = name !== "login";
  document.getElementById("feed-view").hidden   = name !== "feed";
}

// ── tag sidebar ────────────────────────────────────────────────────────────
async function loadTagSidebar() {
  const r = await fetch("/tags", {headers: authHeaders()});
  if (!r.ok) return;
  const data = await r.json();
  const list = document.getElementById("tag-list");
  const empty = document.getElementById("sidebar-empty");
  list.innerHTML = "";
  if (!data.tags.length) { empty.hidden = false; return; }
  empty.hidden = true;
  for (const {tag, count} of data.tags) {
    const btn = document.createElement("button");
    btn.className = "tag-btn" + (activeTags.has(tag) ? " active" : "");
    btn.innerHTML = '<span>' + esc(tag) + '</span><span class="tc">' + count + '</span>';
    btn.onclick = () => toggleTag(tag);
    list.appendChild(btn);
  }
}

function toggleTag(tag) {
  if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
  document.getElementById("clear-tags-btn").hidden = activeTags.size === 0;
  updateTagButtons();
  resetFeed();
}
function updateTagButtons() {
  document.querySelectorAll(".tag-btn").forEach(btn => {
    const tag = btn.querySelector("span:first-child").textContent;
    btn.classList.toggle("active", activeTags.has(tag));
  });
}
function clearTagFilter() {
  activeTags.clear();
  document.getElementById("clear-tags-btn").hidden = true;
  updateTagButtons();
  resetFeed();
}

// ── feed ───────────────────────────────────────────────────────────────────
function scheduleSearch(val) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { currentSearch = val.trim() || null; resetFeed(); }, 350);
}

async function tryLoadFeed() {
  showView("feed");
  const ok = await resetFeed();
  if (!ok) { showView("login"); return false; }
  loadIdentity();
  loadTagSidebar();
  return true;
}

async function resetFeed() {
  nextCursor = null; allPosts = []; currentIdx = -1;
  document.getElementById("timeline").innerHTML = "";
  document.getElementById("empty-msg").hidden = true;
  document.getElementById("feed-status").textContent = "";
  return await loadMore();
}

async function loadMore() {
  let url = "/posts?limit=20";
  if (nextCursor) url += "&cursor=" + encodeURIComponent(nextCursor);
  if (currentSearch) url += "&q=" + encodeURIComponent(currentSearch);
  for (const t of activeTags) url += "&tags=" + encodeURIComponent(t);
  const r = await fetch(url, {headers: authHeaders()});
  if (r.status === 401) { logout(); return false; }
  if (!r.ok) return false;
  const data = await r.json();
  const timeline = document.getElementById("timeline");
  for (const post of data.posts) {
    allPosts.push(post);
    timeline.appendChild(makePostCard(post, allPosts.length - 1));
  }
  nextCursor = data.next_cursor || null;
  document.getElementById("load-more-btn").hidden = !nextCursor;
  const n = allPosts.length;
  document.getElementById("feed-status").textContent = n ? n + (nextCursor ? "+" : "") + " post" + (n !== 1 ? "s" : "") : "";
  document.getElementById("empty-msg").hidden = n > 0;
  return true;
}

function makePostCard(post, idx) {
  const div = document.createElement("div");
  div.className = "post-card";
  div.dataset.idx = idx;
  div.onclick = () => openDetail(idx);

  // body preview — strip [asset:uuid] refs
  const previewText = (post.body || "").replace(/\[asset:[0-9a-f-]+\]/g, "").trim();
  const hasOnlyRefs = !previewText && post.assets && post.assets.length;
  if (previewText) {
    const p = document.createElement("div");
    p.className = "post-body-preview" + (post.assets && post.assets.length ? "" : " text-only");
    p.textContent = previewText;
    div.appendChild(p);
  }

  // thumbnail strip
  if (post.assets && post.assets.length) {
    const strip = document.createElement("div");
    strip.className = "post-thumbs";
    for (const asset of post.assets) {
      if ((asset.media_type || "").startsWith("image/")) {
        const img = document.createElement("img");
        img.className = "post-thumb loading";
        img.onload = img.onerror = () => img.classList.remove("loading");
        img.alt = ""; img.loading = "lazy";
        img.src = "/assets/" + asset.id + "/thumb?token=" + encodeURIComponent(TOKEN);
        strip.appendChild(img);
      } else {
        const ic = document.createElement("div");
        ic.className = "post-thumb-icon";
        ic.textContent = mimeIcon(asset.media_type);
        strip.appendChild(ic);
      }
    }
    div.appendChild(strip);
  }

  // footer: tags + date + comment count
  const foot = document.createElement("div");
  foot.className = "post-foot";
  const tagHtml = (post.tags || []).map(t =>
    '<span class="tag-chip' + (activeTags.has(t) ? " active" : "") + '">' + esc(t) + '</span>'
  ).join("");
  const dateFmt = post.created_at ? new Date(post.created_at * 1000).toLocaleDateString() : "";
  const cc = post.comment_count || 0;
  const isIM = post.post_type === "inner_monologue";
  const vis = isIM
    ? '<span title="Inner monologue" style="color:#8a6fc4">&#x1F4D3;</span>'
    : post.public ? '<span title="Published">&#x1F310;</span>' : '<span title="Private" style="color:#555">&#x1F512;</span>';
  if (isIM) div.style.borderLeft = "3px solid #8a6fc4";
  foot.innerHTML = tagHtml
    + '<span class="post-date" style="margin-left:auto">' + dateFmt + '</span>'
    + (cc ? '<span class="post-comment-count">&#x1F4AC; ' + cc + '</span>' : '')
    + (IS_OWNER ? vis : '');
  div.appendChild(foot);
  return div;
}

// ── keyboard navigation ────────────────────────────────────────────────────
document.addEventListener("keydown", e => {
  if (!document.getElementById("compose-overlay").hidden) return;
  if (document.getElementById("detail-overlay").hidden) return;
  if (e.key === "Escape") { closeDetail(); return; }
  if (e.key === "ArrowLeft"  || e.key === "ArrowUp")   { e.preventDefault(); navigatePost(-1); }
  if (e.key === "ArrowRight" || e.key === "ArrowDown")  { e.preventDefault(); navigatePost(1);  }
});

function navigatePost(delta) {
  const next = currentIdx + delta;
  if (next < 0 || next >= allPosts.length) return;
  openDetail(next);
  if (next >= allPosts.length - 3 && nextCursor) loadMore();
}

function highlightCard(idx) {
  document.querySelectorAll(".post-card.active-card").forEach(c => c.classList.remove("active-card"));
  const card = document.querySelector(".post-card[data-idx='" + idx + "']");
  if (card) card.classList.add("active-card");
}

// ── detail modal ───────────────────────────────────────────────────────────
let currentPostId = null, replyToId = null;

function renderPostBody(post) {
  const assetMap = {};
  for (const a of (post.assets || [])) assetMap[a.id] = a;
  const parts = (post.body || "").split(/(\[asset:[0-9a-f-]+\])/);
  let rendered = "";
  for (const part of parts) {
    const m = part.match(/^\[asset:([0-9a-f-]+)\]$/);
    if (m) {
      const aid = m[1], a = assetMap[aid];
      const url = "/assets/" + aid + "?token=" + encodeURIComponent(TOKEN);
      if (a && (a.media_type || "").startsWith("image/"))
        rendered += '<span class="asset-block"><img src="' + url + '" alt=""></span>';
      else if (a && (a.media_type || "").startsWith("video/"))
        rendered += '<span class="asset-block"><video src="' + url + '" controls></video></span>';
      else {
        const label = (a && a.title) ? a.title : aid.slice(0, 8) + "…";
        rendered += '<span class="asset-block"><a class="asset-file" href="' + url + '" download>' + mimeIcon(a && a.media_type) + ' ' + esc(label) + '</a></span>';
      }
    } else { rendered += esc(part); }
  }
  return rendered;
}

function openDetail(idx) {
  currentIdx = idx;
  const post = allPosts[idx];
  currentPostId = post.id;
  replyToId = null;
  highlightCard(idx);
  renderDetail(post);
  document.getElementById("nav-prev").hidden = idx <= 0;
  document.getElementById("nav-next").hidden = idx >= allPosts.length - 1;
  document.getElementById("detail-overlay").hidden = false;
  loadComments(post.id);
}

function renderDetail(post) {
  const tagHtml = (post.tags || []).map(t =>
    '<button class="tag-chip' + (activeTags.has(t) ? " active" : "") + '" onclick="filterByTag(\'' + esc(t) + '\')">' + esc(t) + '</button>'
  ).join("");
  const dateFmt = post.created_at ? new Date(post.created_at * 1000).toLocaleString(undefined, {dateStyle:"short",timeStyle:"short"}) : "";
  const ownerActions = IS_OWNER
    ? '<button class="btn btn-muted btn-sm" onclick="startEditPost()">Edit</button>'
      + '<button class="btn btn-danger btn-sm" id="delete-btn" onclick="confirmDeletePost()">Delete</button>'
    : "";

  document.getElementById("detail-body").innerHTML =
    '<div id="post-rendered" class="post-detail-body">' + renderPostBody(post) + '</div>'
    + '<div class="modal-meta">'
    + (tagHtml ? '<div style="margin-top:0.4rem" id="detail-tags">' + tagHtml + '</div>' : '<div id="detail-tags"></div>')
    + '<div style="margin-top:0.4rem">' + dateFmt + '</div>'
    + '</div>'
    + (ownerActions ? '<div class="modal-actions" id="post-actions">' + ownerActions + '</div>' : '')
    + '<div id="comments-section" class="comments"><div class="comments-header" style="color:#555">Loading…</div></div>';
}

function startEditPost() {
  const post = allPosts[currentIdx];
  const rendered = document.getElementById("post-rendered");
  const actions = document.getElementById("post-actions");
  const tagsDiv = document.getElementById("detail-tags");

  rendered.outerHTML = '<textarea id="edit-body" class="edit-body">' + esc(post.body || "") + '</textarea>';
  tagsDiv.innerHTML = '<input type="text" id="edit-tags" style="width:100%;margin-top:0.4rem" '
    + 'value="' + esc((post.tags || []).join(" ")) + '" placeholder="Tags — space-separated">';
  actions.innerHTML =
    '<label style="display:flex;align-items:center;gap:0.4rem;font-size:0.82rem;color:#aaa;cursor:pointer">'
    + '<input type="checkbox" id="edit-public"' + (post.public ? ' checked' : '') + '> Published</label>'
    + '<button class="btn btn-primary btn-sm" onclick="saveEditPost()">Save</button>'
    + '<button class="btn btn-muted btn-sm" onclick="cancelEditPost()">Cancel</button>';
  document.getElementById("edit-body").focus();
}

async function saveEditPost() {
  const body = document.getElementById("edit-body").value;
  const tags = document.getElementById("edit-tags").value.trim().split(/\s+/).filter(Boolean);
  const actions = document.getElementById("post-actions");
  actions.innerHTML = '<span style="font-size:0.82rem;color:#777">Saving…</span>';

  const isPublic = document.getElementById("edit-public") && document.getElementById("edit-public").checked;
  const r = await fetch("/posts/" + currentPostId, {
    method: "PATCH",
    headers: {...authHeaders(), "Content-Type": "application/json"},
    body: JSON.stringify({body, tags, public: isPublic}),
  });
  if (r.ok) {
    const updated = await r.json();
    allPosts[currentIdx] = updated;
    // refresh card in timeline
    const card = document.querySelector(".post-card[data-idx='" + currentIdx + "']");
    if (card) { const newCard = makePostCard(updated, currentIdx); newCard.classList.toggle("active-card", card.classList.contains("active-card")); card.replaceWith(newCard); }
    renderDetail(updated);
    loadTagSidebar();
    loadComments(currentPostId);
  } else {
    actions.innerHTML = '<span style="color:#e06c6c;font-size:0.82rem">Save failed (' + r.status + ')</span>'
      + '<button class="btn btn-primary btn-sm" onclick="saveEditPost()">Retry</button>'
      + '<button class="btn btn-muted btn-sm" onclick="cancelEditPost()">Cancel</button>';
  }
}

function cancelEditPost() { renderDetail(allPosts[currentIdx]); loadComments(currentPostId); }

function confirmDeletePost() {
  const actions = document.getElementById("post-actions");
  actions.innerHTML = '<span style="font-size:0.85rem;color:#e06c6c">Delete this post?</span>'
    + '<button class="btn btn-danger btn-sm" onclick="executeDeletePost()">Yes, delete</button>'
    + '<button class="btn btn-muted btn-sm" onclick="renderDetail(allPosts[currentIdx])">Cancel</button>';
}

async function executeDeletePost() {
  const r = await fetch("/posts/" + currentPostId, {method: "DELETE", headers: authHeaders()});
  if (r.ok) {
    const card = document.querySelector(".post-card[data-idx='" + currentIdx + "']");
    if (card) card.remove();
    allPosts.splice(currentIdx, 1);
    // re-index remaining cards
    document.querySelectorAll(".post-card[data-idx]").forEach(c => {
      const i = parseInt(c.dataset.idx);
      if (i > currentIdx) c.dataset.idx = i - 1;
    });
    closeDetail();
    loadTagSidebar();
    if (!allPosts.length) document.getElementById("empty-msg").hidden = false;
  }
}

function closeDetail() {
  document.getElementById("detail-overlay").hidden = true;
  highlightCard(-1);
  currentIdx = -1; currentPostId = null; replyToId = null;
}

function filterByTag(tag) {
  closeDetail();
  if (activeTags.has(tag)) return;
  activeTags.add(tag);
  document.getElementById("clear-tags-btn").hidden = false;
  updateTagButtons();
  resetFeed();
}

// ── comments ───────────────────────────────────────────────────────────────
async function loadComments(postId) {
  const r = await fetch("/posts/" + postId + "/comments", {headers: authHeaders()});
  const section = document.getElementById("comments-section");
  if (!section || currentPostId !== postId) return;
  if (!r.ok) { section.innerHTML = ""; return; }
  renderComments(postId, (await r.json()).comments);
}

function renderComments(postId, comments) {
  const section = document.getElementById("comments-section");
  if (!section) return;
  const live = comments.filter(c => !c.deleted);
  const byParent = {};
  for (const c of live) { const k = c.parent_id || "__root__"; (byParent[k] = byParent[k] || []).push(c); }

  function renderOne(c, depth) {
    const author = esc(c.author_identity || "owner");
    const replies = byParent[c.id] || [];
    return '<div class="comment">'
      + '<div class="comment-author">' + author + '</div>'
      + '<div class="comment-body">' + esc(c.body) + '</div>'
      + '<div class="comment-foot"><span>' + fmtDate(c.created_at) + '</span>'
      + (depth < 3 ? '<button onclick="setReplyTo(\'' + c.id + '\',\'' + author + '\')">Reply</button>' : '')
      + '</div>'
      + (replies.length ? '<div class="comment-replies">' + replies.map(r => renderOne(r, depth + 1)).join("") + '</div>' : '')
      + '</div>';
  }

  const roots = byParent["__root__"] || [];
  const count = live.length;
  section.innerHTML =
    '<div class="comments-header">' + count + ' comment' + (count !== 1 ? 's' : '') + '</div>'
    + roots.map(c => renderOne(c, 0)).join("")
    + '<div class="comment-form">'
    + '<div id="reply-banner" hidden class="reply-banner"><span id="reply-label"></span><button onclick="clearReplyTo()">&#x2715;</button></div>'
    + '<textarea id="comment-input" placeholder="Add a comment…"></textarea>'
    + '<div class="comment-form-footer"><button class="btn btn-primary btn-sm" onclick="submitComment()">Post</button></div>'
    + '</div>';
}

function setReplyTo(id, label) {
  replyToId = id;
  const banner = document.getElementById("reply-banner");
  if (banner) { document.getElementById("reply-label").textContent = "Replying to " + label; banner.hidden = false; document.getElementById("comment-input").focus(); }
}
function clearReplyTo() { replyToId = null; const b = document.getElementById("reply-banner"); if (b) b.hidden = true; }

async function submitComment() {
  const input = document.getElementById("comment-input");
  const body = input ? input.value.trim() : "";
  if (!body || !currentPostId) return;
  const payload = {body};
  if (replyToId) payload.parent_id = replyToId;
  const r = await fetch("/posts/" + currentPostId + "/comments", {
    method: "POST",
    headers: {...authHeaders(), "Content-Type": "application/json"},
    body: JSON.stringify(payload),
  });
  if (r.ok) { replyToId = null; loadComments(currentPostId); }
}

// ── compose ────────────────────────────────────────────────────────────────
function openCompose() {
  pendingFiles = []; renderFileList();
  document.getElementById("compose-body").value = "";
  document.getElementById("compose-tags").value = "";
  document.getElementById("compose-public").checked = false;
  document.getElementById("compose-public").disabled = false;
  document.getElementById("compose-public-label").style.opacity = "";
  document.getElementById("compose-inner-monologue").checked = false;
  document.getElementById("compose-progress").innerHTML = "";
  document.getElementById("compose-submit").disabled = false;
  document.getElementById("compose-overlay").hidden = false;
  document.getElementById("compose-body").focus();
}
function closeCompose() { document.getElementById("compose-overlay").hidden = true; }

function toggleInnerMonologue(cb) {
  const publicLabel = document.getElementById("compose-public-label");
  const publicCheck = document.getElementById("compose-public");
  if (cb.checked) {
    publicLabel.style.opacity = "0.3";
    publicCheck.disabled = true;
    publicCheck.checked = false;
  } else {
    publicLabel.style.opacity = "";
    publicCheck.disabled = false;
  }
}
function dzOver(e) { e.preventDefault(); document.getElementById("drop-zone").classList.add("over"); }
function dzOut()   { document.getElementById("drop-zone").classList.remove("over"); }
function dzDrop(e) { e.preventDefault(); dzOut(); addFiles(e.dataTransfer.files); }
function pickFiles(files) { addFiles(files); }
function addFiles(files) { for (const f of files) pendingFiles.push(f); renderFileList(); }
function renderFileList() {
  document.getElementById("file-list").innerHTML = pendingFiles.map(f =>
    '<div class="file-item"><span>' + esc(f.name) + '</span><span>' + fmtSize(f.size) + '</span></div>'
  ).join("");
}

async function submitPost() {
  const bodyText = document.getElementById("compose-body").value.trim();
  if (!bodyText && !pendingFiles.length) return;
  const tags = document.getElementById("compose-tags").value.trim().split(/\s+/).filter(Boolean);
  const prog = document.getElementById("compose-progress");
  document.getElementById("compose-submit").disabled = true;
  prog.innerHTML = '<div class="progress-item">Posting…</div>';

  const isPublic = document.getElementById("compose-public").checked;
  const isInnerMonologue = document.getElementById("compose-inner-monologue").checked;
  const fd = new FormData();
  fd.append("body", bodyText);
  fd.append("tags", JSON.stringify(tags));
  fd.append("public", isPublic ? "true" : "false");
  fd.append("post_type", isInnerMonologue ? "inner_monologue" : "post");
  for (const f of pendingFiles) fd.append("files", f);

  try {
    const r = await fetch("/posts", {method: "POST", headers: authHeaders(), body: fd});
    if (r.ok) {
      const post = await r.json();
      prependPost(post);
      loadTagSidebar();
      prog.innerHTML = '<div class="progress-item progress-ok">&#x2713; Posted</div>';
      pendingFiles = []; renderFileList();
      setTimeout(closeCompose, 900);
    } else {
      prog.innerHTML = '<div class="progress-item progress-err">&#x2717; Error ' + r.status + '</div>';
      document.getElementById("compose-submit").disabled = false;
    }
  } catch {
    prog.innerHTML = '<div class="progress-item progress-err">&#x2717; Network error</div>';
    document.getElementById("compose-submit").disabled = false;
  }
}

function prependPost(post) {
  allPosts.unshift(post);
  document.querySelectorAll(".post-card[data-idx]").forEach(c => c.dataset.idx = parseInt(c.dataset.idx) + 1);
  const timeline = document.getElementById("timeline");
  timeline.insertBefore(makePostCard(post, 0), timeline.firstChild);
  document.getElementById("empty-msg").hidden = true;
}

// ── global drag-drop ───────────────────────────────────────────────────────
document.addEventListener("dragover", e => {
  if (TOKEN && IS_OWNER && !document.getElementById("compose-overlay").hidden) return;
  if (TOKEN && IS_OWNER && e.dataTransfer.types.includes("Files")) { e.preventDefault(); document.body.classList.add("drag-active"); }
});
document.addEventListener("dragleave", e => { if (!e.relatedTarget || !document.body.contains(e.relatedTarget)) document.body.classList.remove("drag-active"); });
document.addEventListener("drop", e => {
  document.body.classList.remove("drag-active");
  if (!TOKEN || !IS_OWNER || !e.dataTransfer.files.length || !document.getElementById("compose-overlay").hidden) return;
  e.preventDefault();
  openCompose();
  addFiles(e.dataTransfer.files);
});

// ── shared ─────────────────────────────────────────────────────────────────
function maybeClose(id, e) { if (e.target === document.getElementById(id)) document.getElementById(id).hidden = true; }
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (!document.getElementById("compose-overlay").hidden) { closeCompose(); return; }
    if (!document.getElementById("detail-overlay").hidden) { closeDetail(); }
  }
});
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function mimeIcon(mt) {
  if (!mt) return "📄";
  if (mt.startsWith("video/")) return "🎬";
  if (mt.startsWith("audio/")) return "🎵";
  if (mt === "application/pdf") return "📋";
  return "📄";
}
function fmtDate(ts) { if (!ts) return ""; return new Date(ts * 1000).toLocaleString(undefined, {dateStyle:"short",timeStyle:"short"}); }
function fmtSize(b) { if (b < 1024) return b + " B"; if (b < 1048576) return (b/1024).toFixed(1) + " KB"; return (b/1048576).toFixed(1) + " MB"; }

// ── setup / unlock ─────────────────────────────────────────────────────────
let restoreFile = null;
let _setupToken = null;

function acceptSetupToken() {
  const token = document.getElementById("setup-token-input").value.trim();
  const err = document.getElementById("setup-token-error");
  err.textContent = "";
  if (!token) { err.textContent = "Token required."; return; }
  _setupToken = token;
  document.getElementById("setup-token-step").hidden = true;
  document.getElementById("setup-wizard-step").hidden = false;
}

function showSetupTab(tab) {
  document.getElementById("setup-new-form").hidden = tab !== "new";
  document.getElementById("setup-restore-form").hidden = tab !== "restore";
  document.getElementById("tab-new").classList.toggle("active", tab === "new");
  document.getElementById("tab-restore").classList.toggle("active", tab === "restore");
}

function pickRestoreFile(input) {
  restoreFile = input.files[0] || null;
  document.getElementById("restore-file-label").textContent = restoreFile ? restoreFile.name : "Select backup .zip file";
}

let _handleCheckTimer = null;
let _handleAvailable = false;

function checkHandleAvailability() {
  const handle = document.getElementById("setup-handle").value.trim();
  const status = document.getElementById("setup-handle-status");
  _handleAvailable = false;
  clearTimeout(_handleCheckTimer);
  if (!handle) { status.textContent = ""; return; }
  status.style.color = "#888";
  status.textContent = "Checking…";
  _handleCheckTimer = setTimeout(async () => {
    try {
      const r = await fetch("/setup/check-handle?handle=" + encodeURIComponent(handle));
      const d = await r.json();
      if (r.ok) {
        status.style.color = "#6dbf6d";
        status.textContent = `✓ '${handle}' is available`;
        _handleAvailable = true;
      } else {
        status.style.color = "#e06c6c";
        status.textContent = d.detail || "Handle unavailable";
        _handleAvailable = false;
      }
    } catch { status.style.color = "#888"; status.textContent = "Could not check availability"; }
  }, 400);
}

async function doSetupNew() {
  const email = document.getElementById("setup-owner-email").value.trim();
  const handle = document.getElementById("setup-handle").value.trim();
  const pass = document.getElementById("setup-passphrase").value;
  const confirm = document.getElementById("setup-passphrase-confirm").value;
  const err = document.getElementById("setup-new-error");
  err.textContent = "";
  if (!email || !handle || !pass) { err.textContent = "All fields required."; return; }
  if (!_handleAvailable) { err.textContent = "Please choose an available handle."; return; }
  if (pass !== confirm) { err.textContent = "Passphrases do not match."; return; }
  const body = {passphrase: pass, confirm_passphrase: confirm, owner_identity: "google:" + email, setup_token: _setupToken, handle};
  try {
    const r = await fetch("/setup/new", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body),
    });
    const d = await r.json();
    if (r.status === 403) { _badSetupToken(d.detail); return; }
    if (!r.ok) { err.textContent = d.detail || "Error."; return; }
    showView("login");
  } catch { err.textContent = "Network error."; }
}

async function doSetupRestore() {
  const pass = document.getElementById("restore-passphrase").value;
  const err = document.getElementById("setup-restore-error");
  err.textContent = "";
  if (!restoreFile) { err.textContent = "Please select a backup file."; return; }
  if (!pass) { err.textContent = "Passphrase required."; return; }
  const fd = new FormData();
  fd.append("bundle", restoreFile);
  fd.append("passphrase", pass);
  fd.append("setup_token", _setupToken || "");
  try {
    const r = await fetch("/setup/restore", {method: "POST", body: fd});
    const d = await r.json();
    if (r.status === 403) { _badSetupToken(d.detail); return; }
    if (!r.ok) { err.textContent = d.detail || "Error."; return; }
    showView("login");
  } catch { err.textContent = "Network error."; }
}

function _badSetupToken(msg) {
  _setupToken = null;
  document.getElementById("setup-wizard-step").hidden = true;
  document.getElementById("setup-token-step").hidden = false;
  document.getElementById("setup-token-error").textContent = msg || "Invalid setup token.";
}

async function doUnlock() {
  const pass = document.getElementById("unlock-passphrase").value;
  const err = document.getElementById("unlock-error");
  err.textContent = "";
  if (!pass) { err.textContent = "Passphrase required."; return; }
  try {
    const r = await fetch("/setup/unlock", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({passphrase: pass}),
    });
    const d = await r.json();
    if (!r.ok) { err.textContent = d.detail || "Wrong passphrase."; return; }
    const stored = localStorage.getItem("contac_token");
    if (stored) { TOKEN = stored; const ok = await tryLoadFeed(); if (!ok) showView("login"); }
    else showView("login");
  } catch { err.textContent = "Network error."; }
}

async function downloadBackup() {
  try {
    const r = await fetch("/backup", {headers: authHeaders()});
    if (!r.ok) { alert("Backup failed: " + r.status); return; }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "contacc-backup.zip";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch { alert("Backup failed: network error"); }
}

// ── init ───────────────────────────────────────────────────────────────────
(async function init() {
  const hash = window.location.hash;
  if (hash.startsWith("#token=")) { storeToken(decodeURIComponent(hash.slice(7))); history.replaceState(null,"","/"); }

  try {
    const sr = await fetch("/setup/status");
    if (sr.ok) {
      const sd = await sr.json();
      if (sd.state === "uninitialized") { showView("setup"); return; }
      if (sd.state === "locked") { showView("unlock"); return; }
    }
  } catch {}

  const stored = localStorage.getItem("contac_token");
  if (stored) { TOKEN = stored; tryLoadFeed(); }
  else showView("login");
})();
</script>
