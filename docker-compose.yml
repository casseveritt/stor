  # ── registry (opt-in) ─────────────────────────────────────────────────────
  registry:
    image: contacc
    restart: unless-stopped
    profiles: [registry]
    command: python -m registry.main /data/registry.db --host 0.0.0.0 --port 9532
    environment:
      CONTACC_GOOGLE_CLIENT_ID: ${CONTACC_GOOGLE_CLIENT_ID:-}
      CONTACC_GOOGLE_CLIENT_SECRET: ${CONTACC_GOOGLE_CLIENT_SECRET:-}
      CONTACC_REGISTRY_URL: https://${CONTACC_DOMAIN}:8421
    volumes:
      - ${CONTACC_DATA_DIR}/registry:/data
    expose: ["9532"]

  # ── caddy ─────────────────────────────────────────────────────────────────
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "6443:6443"
      - "6444:6444"
      - "6445:6445"
      - "6446:6446"
      - "6447:6447"
      - "6448:6448"
      - "6449:6449"
      - "6450:6450"
      - "6451:6451"
      - "6452:6452"
      - "6453:6453"
      - "8443:8443"
      - "8444:8444"
      - "8445:8445"
      - "8446:8446"
      - "8447:8447"
      - "8448:8448"
      - "8449:8449"
      - "8450:8450"
      - "8451:8451"
      - "8452:8452"
      - "8453:8453"
      - "8421:8421"
    environment:
      CONTACC_DOMAIN: ${CONTACC_DOMAIN}
    volumes:
      - ${CADDY_CONFIG:-./deploy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - ${CONTACC_DATA_DIR}/caddy:/data
      - ${CONTACC_DATA_DIR}/caddy-config:/config
    depends_on:
      - web-0
      - web-1
