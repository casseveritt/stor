x-me: &me
  image: contacc
  restart: unless-stopped
  command: python -m server.main /data/node_config.json --host 0.0.0.0 --port 9443
  expose: ["9443"]

x-them: &them
  image: contacc
  restart: unless-stopped
  command: python -m client.main /data/client_config.json --host 0.0.0.0 --port 9444
  expose: ["9444"]

x-web: &web
  image: caddy:2-alpine
  restart: unless-stopped
  command: caddy run --config /etc/caddy/WebCaddyfile
  expose: ["9544"]
  volumes:
    - ${CONTACC_WEB_CONFIG:-./deploy/WebCaddyfile}:/etc/caddy/WebCaddyfile:ro
    - ./web:/srv/web:ro

x-env: &proxy-env
  CONTACC_IDENTITY_PROXY_URL: ${CONTACC_IDENTITY_PROXY_URL:-https://starkville.hopto.org:8421}

services:
  # ── node 1 ────────────────────────────────────────────────────────────────
  node-1-me:
    <<: *me
    build: .
    environment:
      <<: *proxy-env
      CONTACC_PASSPHRASE_UNSECURE: ${CONTACC_PASSPHRASE_UNSECURE:-}
      CONTACC_NODE_ADDRESS: https://${CONTACC_DOMAIN}:8443
    volumes:
      - ${CONTACC_DATA_DIR}/node-1-me:/data

  node-1-them:
    <<: *them
    environment:
      CONTACC_NODE_ADDRESS: https://${CONTACC_DOMAIN}:8443
      CONTACC_SERVER_URL: http://node-1-me:9443
      CONTACC_PASSPHRASE_UNSECURE: ${CONTACC_PASSPHRASE_UNSECURE:-}
    volumes:
      - ${CONTACC_DATA_DIR}/node-1-them:/data
    depends_on: [node-1-me]

  web-1:
    <<: *web
    environment:
      CONTACC_CLIENT_URL: http://node-1-them:9444
    depends_on: [node-1-them]

  # ── node 2 ────────────────────────────────────────────────────────────────
  node-2-me:
    <<: *me
    profiles: [node2]
    environment:
