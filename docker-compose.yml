  # ── node 10 ───────────────────────────────────────────────────────────────
  server-10:
    <<: *server
    profiles: [node10]
    environment:
      <<: *proxy-env
      CONTACC_PASSPHRASE_UNSECURE: ${CONTACC_PASSPHRASE_UNSECURE_10:-}
      CONTACC_NODE_ADDRESS: https://${CONTACC_DOMAIN}:8452
    volumes:
