      CONTACC_PASSPHRASE_UNSECURE: ${CONTACC_PASSPHRASE_UNSECURE_10:-}
    volumes:
      - ${CONTACC_DATA_DIR}/client-10:/data
    depends_on: [server-10]

  # ── registry (opt-in) ─────────────────────────────────────────────────────
  registry:
    image: contacc
    restart: unless-stopped
    profiles: [registry]
    command: python -m registry.main /data/registry.db --host 0.0.0.0 --port 9532
    environment:
      CONTACC_GOOGLE_CLIENT_ID: ${CONTACC_GOOGLE_CLIENT_ID:-}
      CONTACC_GOOGLE_CLIENT_SECRET: ${CONTACC_GOOGLE_CLIENT_SECRET:-}
      CONTACC_REGISTRY_URL: https://${CONTACC_DOMAIN}:8421
    volumes:
      - ${CONTACC_DATA_DIR}/registry:/data
    expose: ["9532"]

  # ── caddy ─────────────────────────────────────────────────────────────────
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "8421:8421"
      - "8443:8443"
      - "8444:8444"
      - "8445:8445"
      - "8446:8446"
      - "8447:8447"
      - "8448:8448"
      - "8449:8449"
      - "8450:8450"
      - "8451:8451"
      - "8452:8452"
    environment:
      CONTACC_DOMAIN: ${CONTACC_DOMAIN}
    volumes:
      - ${CADDY_CONFIG:-./deploy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - ${CONTACC_DATA_DIR}/caddy:/data
      - ${CONTACC_DATA_DIR}/caddy-config:/config
    depends_on:
      - server-1
      - client-1
