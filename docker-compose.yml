x-server: &server
  image: contacc
  restart: unless-stopped
  command: python -m server.main /data/node_config.json --host 0.0.0.0 --port 9443
  expose: ["9443"]

x-client: &client
  image: contacc
  restart: unless-stopped
  command: python -m client.main /data/client_config.json --host 0.0.0.0 --port 9444
  expose: ["9444"]

x-env: &proxy-env
  CONTACC_IDENTITY_PROXY_URL: ${CONTACC_IDENTITY_PROXY_URL:-https://starkville.hopto.org:8421}

services:
  # ── node 1 ────────────────────────────────────────────────────────────────
  server-1:
    <<: *server
    build: .
    environment:
      <<: *proxy-env
      CONTACC_PASSPHRASE_UNSECURE: ${CONTACC_PASSPHRASE_UNSECURE:-}
      CONTACC_NODE_ADDRESS: https://${CONTACC_DOMAIN}:8443
    volumes:
      - ${CONTACC_DATA_DIR}/server-1:/data

  client-1:
    <<: *client
    environment:
      CONTACC_NODE_ADDRESS: https://${CONTACC_DOMAIN}:8443
      CONTACC_SERVER_URL: http://server-1:9443
      CONTACC_PASSPHRASE_UNSECURE: ${CONTACC_PASSPHRASE_UNSECURE:-}
    volumes:
      - ${CONTACC_DATA_DIR}/client-1:/data
    depends_on: [server-1]

  # ── node 2 ────────────────────────────────────────────────────────────────
  server-2:
    <<: *server
    profiles: [node2]
    environment:
      <<: *proxy-env
      CONTACC_PASSPHRASE_UNSECURE: ${CONTACC_PASSPHRASE_UNSECURE_2:-}
      CONTACC_NODE_ADDRESS: https://${CONTACC_DOMAIN}:8444
    volumes:
      - ${CONTACC_DATA_DIR}/server-2:/data

  client-2:
    <<: *client
    profiles: [node2]
    environment:
      CONTACC_NODE_ADDRESS: https://${CONTACC_DOMAIN}:8444
      CONTACC_SERVER_URL: http://server-2:9443
      CONTACC_PASSPHRASE_UNSECURE: ${CONTACC_PASSPHRASE_UNSECURE_2:-}
    volumes:
      - ${CONTACC_DATA_DIR}/client-2:/data
    depends_on: [server-2]

  # ── node 3 ────────────────────────────────────────────────────────────────
  server-3:
