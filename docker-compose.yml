x-me: &me
  image: contacc
  restart: unless-stopped
  command: sh -c "python -m server.main /data/node_config.json --host 0.0.0.0 --port $$CONTACC_ME_PORT"

x-them: &them
  image: contacc
  restart: unless-stopped
  command: sh -c "python -m client.main /data/client_config.json --host 0.0.0.0 --port $$CONTACC_THEM_PORT"

x-web: &web
  image: caddy:2-alpine
  restart: unless-stopped
  command: caddy run --config /etc/caddy/WebCaddyfile
  volumes:
    - ${CONTACC_WEB_CONFIG:-./deploy/WebCaddyfile}:/etc/caddy/WebCaddyfile:ro
    - ./web:/srv/web:ro

x-env: &proxy-env
  CONTACC_IDENTITY_PROXY_URL: ${CONTACC_IDENTITY_PROXY_URL:-https://starkville.hopto.org:8421}

services:
  # ── node 0 ────────────────────────────────────────────────────────────────────────
  node-0-me:
    <<: *me
    expose: ["28443"]
    environment:
      <<: *proxy-env
      CONTACC_ME_PORT: "28443"
      CONTACC_PASSPHRASE_UNSECURE: ${CONTACC_PASSPHRASE_UNSECURE:-}
      CONTACC_NODE_ADDRESS: https://${CONTACC_DOMAIN}:8443
    volumes:
      - ${CONTACC_DATA_DIR}/node-0-me:/data

  node-0-them:
    <<: *them
    expose: ["18443"]
    environment:
      CONTACC_THEM_PORT: "18443"
      CONTACC_NODE_ADDRESS: https://${CONTACC_DOMAIN}:8443
      CONTACC_SERVER_URL: http://node-0-me:28443
      CONTACC_PASSPHRASE_UNSECURE: ${CONTACC_PASSPHRASE_UNSECURE:-}
    volumes:
      - ${CONTACC_DATA_DIR}/node-0-them:/data
    depends_on: [node-0-me]

  web-0:
    <<: *web
    expose: ["16443"]
    environment:
      CONTACC_WEB_PORT: "16443"
      CONTACC_CLIENT_URL: http://node-0-them:18443
    depends_on: [node-0-them]

  # ── node 1 ────────────────────────────────────────────────────────────────────────
