x-server: &server
  image: contacc
  restart: unless-stopped
  command: python -m server.main /data/node_config.json --host 0.0.0.0 --port 9443
  expose: ["9443"]

x-client: &client
  image: contacc
  restart: unless-stopped
  command: python -m client.main /data/client_config.json --host 0.0.0.0 --port 9444
  expose: ["9444"]

x-env: &proxy-env
  CONTACC_IDENTITY_PROXY_URL: ${CONTACC_IDENTITY_PROXY_URL:-https://starkville.hopto.org:8421}

services:
  # ── slot 1 (default) ──────────────────────────────────────────────────────
  server:
    <<: *server
    build: .
    environment:
      <<: *proxy-env
      CONTACC_PASSPHRASE: ${CONTACC_PASSPHRASE:-}
      CONTACC_NODE_ADDRESS: https://${CONTACC_DOMAIN}:8443
    volumes:
      - ${CONTACC_DATA_DIR}/server:/data

  client:
    <<: *client
    environment:
      CONTACC_CLIENT_URL: https://${CONTACC_DOMAIN}:8444
    volumes:
      - ${CONTACC_DATA_DIR}/client:/data
    depends_on: [server]

  # ── slot 2 ────────────────────────────────────────────────────────────────
  server-2:
    <<: *server
    profiles: [slot2]
    environment:
      <<: *proxy-env
      CONTACC_PASSPHRASE: ${CONTACC_PASSPHRASE_2:-}
      CONTACC_NODE_ADDRESS: https://${CONTACC_DOMAIN}:8445
    volumes:
      - ${CONTACC_DATA_DIR}/server-2:/data

  client-2:
    <<: *client
    profiles: [slot2]
    environment:
      CONTACC_CLIENT_URL: https://${CONTACC_DOMAIN}:8446
    volumes:
      - ${CONTACC_DATA_DIR}/client-2:/data
    depends_on: [server-2]

  # ── slot 3 ────────────────────────────────────────────────────────────────
  server-3:
    <<: *server
    profiles: [slot3]
    environment:
      <<: *proxy-env
      CONTACC_PASSPHRASE: ${CONTACC_PASSPHRASE_3:-}
      CONTACC_NODE_ADDRESS: https://${CONTACC_DOMAIN}:8447
    volumes:
      - ${CONTACC_DATA_DIR}/server-3:/data

  client-3:
    <<: *client
    profiles: [slot3]
    environment:
      CONTACC_CLIENT_URL: https://${CONTACC_DOMAIN}:8448
    volumes:
      - ${CONTACC_DATA_DIR}/client-3:/data
    depends_on: [server-3]

  # ── slot 4 ────────────────────────────────────────────────────────────────
  server-4:
    <<: *server
    profiles: [slot4]
    environment:
      <<: *proxy-env
      CONTACC_PASSPHRASE: ${CONTACC_PASSPHRASE_4:-}
      CONTACC_NODE_ADDRESS: https://${CONTACC_DOMAIN}:8449
    volumes:
      - ${CONTACC_DATA_DIR}/server-4:/data

  client-4:
    <<: *client
    profiles: [slot4]
    environment:
      CONTACC_CLIENT_URL: https://${CONTACC_DOMAIN}:8450
    volumes:
      - ${CONTACC_DATA_DIR}/client-4:/data
    depends_on: [server-4]

  # ── slot 5 ────────────────────────────────────────────────────────────────
  server-5:
    <<: *server
    profiles: [slot5]
    environment:
      <<: *proxy-env
      CONTACC_PASSPHRASE: ${CONTACC_PASSPHRASE_5:-}
      CONTACC_NODE_ADDRESS: https://${CONTACC_DOMAIN}:8451
    volumes:
      - ${CONTACC_DATA_DIR}/server-5:/data

  client-5:
    <<: *client
    profiles: [slot5]
    environment:
      CONTACC_CLIENT_URL: https://${CONTACC_DOMAIN}:8452
    volumes:
      - ${CONTACC_DATA_DIR}/client-5:/data
    depends_on: [server-5]

  # ── slot 6 ────────────────────────────────────────────────────────────────
  server-6:
    <<: *server
    profiles: [slot6]
    environment:
      <<: *proxy-env
      CONTACC_PASSPHRASE: ${CONTACC_PASSPHRASE_6:-}
      CONTACC_NODE_ADDRESS: https://${CONTACC_DOMAIN}:8453
    volumes:
      - ${CONTACC_DATA_DIR}/server-6:/data

  client-6:
    <<: *client
    profiles: [slot6]
    environment:
      CONTACC_CLIENT_URL: https://${CONTACC_DOMAIN}:8454
    volumes:
      - ${CONTACC_DATA_DIR}/client-6:/data
    depends_on: [server-6]

  # ── slot 7 ────────────────────────────────────────────────────────────────
  server-7:
    <<: *server
    profiles: [slot7]
    environment:
      <<: *proxy-env
      CONTACC_PASSPHRASE: ${CONTACC_PASSPHRASE_7:-}
      CONTACC_NODE_ADDRESS: https://${CONTACC_DOMAIN}:8455
    volumes:
      - ${CONTACC_DATA_DIR}/server-7:/data

  client-7:
    <<: *client
    profiles: [slot7]
    environment:
      CONTACC_CLIENT_URL: https://${CONTACC_DOMAIN}:8456
    volumes:
      - ${CONTACC_DATA_DIR}/client-7:/data
    depends_on: [server-7]

  # ── slot 8 ────────────────────────────────────────────────────────────────
  server-8:
    <<: *server
    profiles: [slot8]
    environment:
      <<: *proxy-env
      CONTACC_PASSPHRASE: ${CONTACC_PASSPHRASE_8:-}
      CONTACC_NODE_ADDRESS: https://${CONTACC_DOMAIN}:8457
    volumes:
      - ${CONTACC_DATA_DIR}/server-8:/data

  client-8:
    <<: *client
    profiles: [slot8]
    environment:
      CONTACC_CLIENT_URL: https://${CONTACC_DOMAIN}:8458
    volumes:
      - ${CONTACC_DATA_DIR}/client-8:/data
    depends_on: [server-8]

  # ── slot 9 ────────────────────────────────────────────────────────────────
  server-9:
    <<: *server
    profiles: [slot9]
    environment:
      <<: *proxy-env
      CONTACC_PASSPHRASE: ${CONTACC_PASSPHRASE_9:-}
      CONTACC_NODE_ADDRESS: https://${CONTACC_DOMAIN}:8459
    volumes:
      - ${CONTACC_DATA_DIR}/server-9:/data

  client-9:
    <<: *client
    profiles: [slot9]
    environment:
      CONTACC_CLIENT_URL: https://${CONTACC_DOMAIN}:8460
    volumes:
      - ${CONTACC_DATA_DIR}/client-9:/data
    depends_on: [server-9]

  # ── slot 10 ───────────────────────────────────────────────────────────────
  server-10:
    <<: *server
    profiles: [slot10]
    environment:
      <<: *proxy-env
      CONTACC_PASSPHRASE: ${CONTACC_PASSPHRASE_10:-}
      CONTACC_NODE_ADDRESS: https://${CONTACC_DOMAIN}:8461
    volumes:
      - ${CONTACC_DATA_DIR}/server-10:/data

  client-10:
    <<: *client
    profiles: [slot10]
    environment:
      CONTACC_CLIENT_URL: https://${CONTACC_DOMAIN}:8462
    volumes:
      - ${CONTACC_DATA_DIR}/client-10:/data
    depends_on: [server-10]

  # ── registry (opt-in) ─────────────────────────────────────────────────────
  registry:
    image: contacc
    restart: unless-stopped
    profiles: [registry]
    command: python -m registry.main /data/registry.db --host 0.0.0.0 --port 9532
    environment:
      CONTACC_GOOGLE_CLIENT_ID: ${CONTACC_GOOGLE_CLIENT_ID:-}
      CONTACC_GOOGLE_CLIENT_SECRET: ${CONTACC_GOOGLE_CLIENT_SECRET:-}
      CONTACC_REGISTRY_URL: https://${CONTACC_DOMAIN}:8421
    volumes:
      - ${CONTACC_DATA_DIR}/registry:/data
    expose: ["9532"]

  # ── caddy ─────────────────────────────────────────────────────────────────
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "8421:8421"
      - "8443:8443"
      - "8444:8444"
      - "8445:8445"
      - "8446:8446"
      - "8447:8447"
      - "8448:8448"
      - "8449:8449"
      - "8450:8450"
      - "8451:8451"
      - "8452:8452"
      - "8453:8453"
      - "8454:8454"
      - "8455:8455"
      - "8456:8456"
      - "8457:8457"
      - "8458:8458"
      - "8459:8459"
      - "8460:8460"
      - "8461:8461"
      - "8462:8462"
    environment:
      CONTACC_DOMAIN: ${CONTACC_DOMAIN}
    volumes:
      - ${CONTACC_CADDYFILE:-./deploy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - ${CONTACC_DATA_DIR}/caddy:/data
      - ${CONTACC_DATA_DIR}/caddy-config:/config
    depends_on:
      - server
      - client
