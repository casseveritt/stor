<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>contac — signing in</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111; color: #e0e0e0;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .msg { text-align: center; color: #666; }
  </style>
</head>
<body>
<div class="msg" id="msg">Signing in…</div>
<script>
(async function() {
  const hash = window.location.hash;
  if (!hash.startsWith("#token=")) {
    document.getElementById("msg").textContent = "Login failed: no token received.";
    return;
  }
  const serverToken = decodeURIComponent(hash.slice(7));
  const r = await fetch("/client/session", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({token: serverToken}),
  });
  if (r.ok) {
    localStorage.setItem("contac_client_session", (await r.json()).token);
    window.location.href = "/";
  } else {
    const detail = await r.json().catch(() => ({}));
    document.getElementById("msg").textContent =
      r.status === 403 ? "Access denied: owner identity required."
                       : "Login failed: " + (detail.detail || r.status);
  }
})();
</script>
</body>
</html>
