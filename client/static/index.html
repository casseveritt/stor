<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>contacc</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #111; color: #e0e0e0; min-height: 100vh; }

    /* ── login screens ── */
    #login-server { font-size: 0.82rem; color: #555; }
#login-view { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 1.25rem; }

    /* ── chrome ── */
    header { background: #1a1a1a; padding: 0.6rem 1rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a2a; position: sticky; top: 0; z-index: 20; gap: 0.5rem; }
    .header-left  { display: flex; align-items: center; gap: 0.75rem; flex-shrink: 0; }
    .header-right { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
    .post-author { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.35rem; cursor: default; }
    .post-author-avatar { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .post-author-initials { width: 20px; height: 20px; border-radius: 50%; background: #2a4a7a; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; color: #aac8ff; flex-shrink: 0; }
    .post-author-name { font-size: 0.8rem; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #handle-display { font-size: 1.05rem; font-weight: 400; color: #aaa; }
    #search-wrap { flex: 1; min-width: 0; }
    #search-input { width: 100%; padding: 0.4rem 0.7rem; border-radius: 4px; border: 1px solid #333; background: #222; color: #e0e0e0; font-size: 0.88rem; outline: none; }
    #search-input:focus { border-color: #4285f4; }

    /* ── layout ── */
    #feed-view { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    #body-wrap { display: flex; flex: 1; overflow: hidden; }

    /* ── sidebar ── */
    #sidebar { width: 200px; flex-shrink: 0; background: #161616; border-right: 1px solid #242424; overflow-y: auto; padding: 0.75rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .sidebar-section { display: flex; flex-direction: column; gap: 0.25rem; }
    .sidebar-head { font-size: 0.72rem; color: #555; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.25rem; }
    .server-btn { background: none; border: none; text-align: left; cursor: pointer; padding: 0.3rem 0.5rem; border-radius: 4px; font-size: 0.82rem; display: flex; justify-content: space-between; align-items: center; gap: 0.4rem; color: #888; width: 100%; }
    .server-btn:hover { background: #222; color: #ccc; }
    .server-btn.active { background: #1e2d4a; color: #6aa3f5; }
    .server-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .server-dot.ok   { background: #4caf50; }
    .server-dot.err  { background: #e06c6c; }
    .server-dot.wait { background: #555; }
    .contact-row { display: flex; align-items: center; position: relative; }
    .contact-row .server-btn { flex: 1; }
    .contact-remove { display: none; background: none; border: none; cursor: pointer; font-size: 0.7rem; color: #666; line-height: 1; padding: 0 4px; flex-shrink: 0; }
    .contact-row:hover .contact-remove { display: inline; }
    .contact-remove:hover { color: #e06c6c; }
    #tag-list { display: flex; flex-direction: column; gap: 0.25rem; }
    .tag-btn { background: none; border: none; text-align: left; cursor: pointer; padding: 0.3rem 0.5rem; border-radius: 4px; font-size: 0.82rem; color: #888; display: flex; justify-content: space-between; align-items: center; }
    .tag-btn:hover { background: #222; color: #ccc; }
    .tag-btn.active { background: #1e2d4a; color: #6aa3f5; }
    .tag-btn .tc { font-size: 0.72rem; color: #555; }
    #clear-tags-btn { font-size: 0.75rem; color: #4285f4; background: none; border: none; cursor: pointer; padding: 0.2rem 0.5rem; text-align: left; }
    #clear-tags-btn:hover { text-decoration: underline; }

    /* ── timeline ── */
    #main-area { flex: 1; overflow-y: auto; padding: 1rem; }
    #timeline { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 0.75rem; }
    #feed-status { font-size: 0.8rem; color: #555; margin-bottom: 0.5rem; max-width: 680px; margin-left: auto; margin-right: auto; }
    .more-row { text-align: center; padding: 1rem; max-width: 680px; margin: 0 auto; }
    .empty { color: #555; text-align: center; padding: 3rem; }

    /* ── post card ── */
    .post-card { background: #1e1e1e; border-radius: 8px; padding: 1rem; cursor: pointer; transition: background 0.1s; border: 2px solid transparent; }
    .post-card:hover { background: #232323; }
    .post-card.active-card { border-color: #4285f4; }
    .post-source { font-size: 0.72rem; color: #555; margin-bottom: 0.4rem; }
    .post-body-preview { font-size: 0.92rem; color: #ccc; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
      display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .post-thumbs { display: flex; gap: 4px; margin-top: 0.6rem; overflow-x: auto; }
    .post-thumb { width: 100px; height: 100px; object-fit: cover; border-radius: 4px; flex-shrink: 0; background: #2a2a2a; }
    .post-thumb-icon { width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; font-size: 2rem; background: #2a2a2a; border-radius: 4px; flex-shrink: 0; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
    .post-thumb.loading { animation: pulse 1.4s ease-in-out infinite; }
    .post-foot { margin-top: 0.6rem; display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; font-size: 0.76rem; color: #555; }
    .post-date { flex-shrink: 0; }

    /* ── overlays ── */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.88); display: flex; align-items: center; justify-content: center; z-index: 50; }
    .modal { background: #1e1e1e; border-radius: 8px; max-width: min(90vw, 720px); width: 100%; max-height: 90vh; overflow: auto; padding: 1.25rem; position: relative; }
    .modal-close { position: absolute; top: 0.6rem; right: 0.75rem; background: none; border: none; color: #aaa; font-size: 1.4rem; cursor: pointer; line-height: 1; }
    .modal-close:hover { color: #fff; }
    .modal h3 { color: #fff; margin-bottom: 1rem; font-weight: 400; }
    .modal-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); border: none; color: #aaa; font-size: 1.8rem; cursor: pointer; padding: 0.5rem 0.7rem; border-radius: 4px; line-height: 1; }
    .modal-nav:hover { color: #fff; background: rgba(0,0,0,0.75); }
    #nav-prev { left: -3rem; }
    #nav-next { right: -3rem; }
    .post-detail-body { font-size: 0.95rem; color: #ddd; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
    .post-detail-body .asset-block { display: block; margin: 0.75rem 0; white-space: normal; }
    .post-detail-body .asset-block img { max-width: 100%; border-radius: 6px; display: block; }
    .post-detail-body .asset-block video { max-width: 100%; border-radius: 6px; display: block; }
    .post-detail-body .asset-block .asset-file { display: inline-flex; align-items: center; gap: 0.5rem; background: #2a2a2a; padding: 0.4rem 0.75rem; border-radius: 4px; font-size: 0.85rem; color: #aaa; text-decoration: none; }
    .post-detail-body .asset-block .asset-file:hover { background: #333; color: #eee; }
    .modal-meta { margin-top: 0.75rem; font-size: 0.85rem; color: #888; }
    .tag-chip { display: inline-block; background: #2a2a2a; color: #aaa; padding: 2px 9px; border-radius: 12px; font-size: 0.75rem; margin: 2px; cursor: pointer; border: none; }
    .tag-chip:hover { background: #1e2d4a; color: #6aa3f5; }
    .tag-chip.active { background: #1e2d4a; color: #6aa3f5; }

    /* ── comments ── */
    .comments { margin-top: 1rem; padding-top: 0.75rem; border-top: 1px solid #2a2a2a; }
    .comments-header { font-size: 0.85rem; color: #777; margin-bottom: 0.75rem; }
    .comment { padding: 0.5rem 0; border-bottom: 1px solid #1a1a1a; }
    .comment:last-of-type { border-bottom: none; }
    .comment-author { font-size: 0.73rem; color: #666; margin-bottom: 0.2rem; }
    .comment-body { font-size: 0.88rem; color: #ccc; white-space: pre-wrap; word-break: break-word; }
    .comment-foot { font-size: 0.72rem; color: #555; margin-top: 0.2rem; }
    .comment-replies { margin-left: 1rem; padding-left: 0.75rem; border-left: 2px solid #2a2a2a; }
    .comment-form { margin-top: 0.75rem; }
    .comment-form textarea { background: #222; color: #e0e0e0; border: 1px solid #333; border-radius: 4px; padding: 0.5rem; width: 100%; font-size: 0.88rem; resize: vertical; min-height: 60px; outline: none; font-family: inherit; }
    .comment-form textarea:focus { border-color: #4285f4; }
    .comment-form-footer { display: flex; justify-content: flex-end; margin-top: 0.4rem; }

    /* ── compose ── */
    #compose-modal { min-width: min(90vw, 560px); }
    #compose-body { background: #222; color: #e0e0e0; border: 1px solid #333; border-radius: 4px; padding: 0.6rem; width: 100%; font-size: 0.95rem; resize: vertical; min-height: 100px; outline: none; font-family: inherit; margin-bottom: 0.75rem; }
    #compose-body:focus { border-color: #4285f4; }
    .drop-zone { border: 2px dashed #444; border-radius: 6px; padding: 1.25rem 1rem; text-align: center; cursor: pointer; color: #777; transition: border-color 0.15s; }
    .drop-zone:hover, .drop-zone.over { border-color: #4285f4; color: #aaa; }
    .drop-zone-icon { font-size: 1.5rem; margin-bottom: 0.25rem; }
    .file-list { margin: 0.6rem 0; max-height: 100px; overflow-y: auto; }
    .file-item { font-size: 0.82rem; padding: 0.2rem 0; color: #aaa; display: flex; justify-content: space-between; }
    .compose-fields { display: flex; flex-direction: column; gap: 0.5rem; margin: 0.6rem 0; }
    .upload-progress { font-size: 0.85rem; color: #aaa; min-height: 1.4em; margin: 0.5rem 0; }
    .progress-item { padding: 0.15rem 0; }
    .progress-ok { color: #6cbe6c; }
    .progress-err { color: #e06c6c; }

    /* ── profile ── */
    #profile-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; cursor: pointer; border: 2px solid #333; flex-shrink: 0; }
    #profile-avatar-initials { width: 32px; height: 32px; border-radius: 50%; background: #2a4a7a; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; color: #aac8ff; cursor: pointer; border: 2px solid #333; flex-shrink: 0; }
    .profile-modal-photo { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
    .profile-modal-photo img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; background: #333; border: 2px solid #333; }
    .profile-initials-lg { width: 80px; height: 80px; border-radius: 50%; background: #2a4a7a; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #aac8ff; font-weight: 300; }
    .contact-profile-card { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem; background: #252525; border-radius: 8px; margin-bottom: 0.5rem; }
    .contact-profile-card img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: #333; flex-shrink: 0; }
    .contact-profile-initials { width: 48px; height: 48px; border-radius: 50%; background: #2a4a7a; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; color: #aac8ff; flex-shrink: 0; }
    .contact-profile-info { display: flex; flex-direction: column; gap: 0.15rem; }
    .contact-profile-name { font-size: 0.95rem; color: #e0e0e0; }
    .contact-profile-handle { font-size: 0.78rem; color: #666; }

    /* ── shared ── */
    .btn { padding: 0.42rem 1rem; border: none; border-radius: 4px; cursor: pointer; font-size: 0.88rem; }
    .btn-primary { background: #4285f4; color: #fff; }
    .btn-primary:hover { background: #3a78e8; }
    .btn-muted { background: #2a2a2a; color: #ccc; }
    .btn-muted:hover { background: #333; }
    .btn-sm { padding: 0.3rem 0.7rem; font-size: 0.8rem; }
    input[type=text] { padding: 0.42rem 0.7rem; border-radius: 4px; border: 1px solid #333; background: #222; color: #e0e0e0; font-size: 0.88rem; outline: none; }
    input[type=text]:focus { border-color: #4285f4; }
    [hidden] { display: none !important; }

    /* ── setup / unlock ── */
    .setup-card { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .setup-inner { max-width: 420px; width: 100%; }
    .setup-inner h1 { font-size: 1.8rem; font-weight: 300; letter-spacing: 0.1em; color: #fff; margin-bottom: 2rem; text-align: center; }
    .setup-logo { display: flex; align-items: center; justify-content: center; gap: 0.6rem; margin-bottom: 2rem; }
    .setup-logo img { height: 44px; }
    .setup-logo span { font-size: 1.8rem; font-weight: 300; letter-spacing: 0.1em; color: #fff; }
    .setup-tabs { display: flex; margin-bottom: 1.5rem; border-radius: 6px; overflow: hidden; border: 1px solid #333; }
    .setup-tab { flex: 1; border-radius: 0; border: none; padding: 0.5rem; cursor: pointer; font-size: 0.88rem; transition: background 0.1s; }
    .setup-tab.active { background: #4285f4; color: #fff; }
    .setup-tab:not(.active) { background: #2a2a2a; color: #aaa; }
    .setup-form { display: flex; flex-direction: column; gap: 0.75rem; }
    .setup-error { color: #e06c6c; font-size: 0.85rem; min-height: 1.2em; }

    @media (max-width: 600px) {
      #sidebar { width: 100%; height: auto; flex-direction: row; flex-wrap: wrap; border-right: none; border-bottom: 1px solid #242424; padding: 0.5rem; }
      #body-wrap { flex-direction: column; }
      #nav-prev { left: 0.25rem; }
      #nav-next { right: 0.25rem; }
    }
  </style>
</head>
<body>

<!-- ── server setup (uninitialized) ──────────────────────────────────────── -->
<div id="setup-view" hidden>
  <div class="setup-card">
    <div class="setup-inner">
      <div class="setup-logo"><img src="/static/favicon.svg"><span>contacc</span></div>
      <div id="setup-token-step" class="setup-form">
        <p style="color:#888;font-size:0.9rem;text-align:center">Enter your setup token to continue.</p>
        <input type="text" id="setup-token-input" placeholder="Setup token" autocomplete="off" onkeydown="if(event.key==='Enter')acceptSetupToken()">
        <button class="btn btn-primary" onclick="acceptSetupToken()">Continue</button>
        <div class="setup-error" id="setup-token-error"></div>
      </div>
      <div id="setup-wizard-step" hidden>
        <div class="setup-tabs">
          <button class="setup-tab active" id="tab-new" onclick="showSetupTab('new')">New Identity</button>
          <button class="setup-tab" id="tab-restore" onclick="showSetupTab('restore')">Restore Backup</button>
        </div>
        <div id="setup-new-form" class="setup-form">
          <input type="email" id="setup-owner-email" placeholder="your@email.com (Google account)">
          <input type="text" id="setup-handle" placeholder="Handle (e.g. alice)" autocomplete="off" autocapitalize="none" oninput="checkHandleAvailability()">
          <div id="setup-handle-status" style="font-size:0.82rem;min-height:1.1em;margin-top:-0.25rem;padding-left:0.1rem"></div>
          <input type="password" id="setup-passphrase" placeholder="Choose a passphrase">
          <input type="password" id="setup-passphrase-confirm" placeholder="Confirm passphrase">
          <button class="btn btn-primary" onclick="doSetupNew()">Create Identity</button>
          <div class="setup-error" id="setup-new-error"></div>
        </div>
        <div id="setup-restore-form" class="setup-form" hidden>
          <input type="file" id="restore-file-input" accept=".zip" onchange="restoreFileSelected(this)">
          <div id="restore-filename" style="font-size:0.82rem;color:#888"></div>
          <input type="password" id="restore-passphrase" placeholder="Passphrase">
          <button class="btn btn-primary" onclick="doSetupRestore()">Restore</button>
          <div class="setup-error" id="setup-restore-error"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ── server unlock (locked) ────────────────────────────────────────────── -->
<div id="unlock-view" hidden>
  <div class="setup-card">
    <div class="setup-inner">
      <div class="setup-logo"><img src="/static/favicon.svg"><span>contacc</span></div>
      <div class="setup-form">
        <p style="color:#888;font-size:0.9rem;text-align:center">Enter your passphrase to unlock the server.</p>
        <input type="password" id="unlock-passphrase" placeholder="Passphrase" onkeydown="if(event.key==='Enter')doUnlock()">
        <button class="btn btn-primary" onclick="doUnlock()">Unlock</button>
        <div class="setup-error" id="unlock-error"></div>
      </div>
    </div>
  </div>
</div>

<!-- ── server login ────────────────────────────────────────────────────────── -->
<div id="login-view" hidden>
  <div class="setup-logo"><img src="/static/favicon.svg"><span>contacc</span></div>
  <div id="login-server"></div>
  <button class="btn btn-primary" onclick="loginGoogle()">Sign in with Google</button>
  <div id="login-error" style="color:#e06c6c;font-size:0.85rem"></div>
</div>

<!-- ── feed ───────────────────────────────────────────────────────────────── -->
<div id="feed-view" hidden>
  <header>
    <div class="header-left">
      <img src="/static/favicon.svg" height="26" style="display:block;flex-shrink:0">
      <div id="profile-avatar-initials" onclick="openProfile()" title="Edit profile" hidden></div>
      <img id="profile-avatar" onclick="openProfile()" title="Edit profile" hidden>
      <span id="handle-display" onclick="filterOwnPosts()" title="Filter to my posts" style="cursor:pointer"></span>
    </div>
    <div id="search-wrap">
      <input type="text" id="search-input" placeholder="Search posts…" oninput="scheduleSearch(this.value)">
    </div>
    <div class="header-right">
      <button id="compose-btn" class="btn btn-primary btn-sm" onclick="openCompose()" hidden>+ Post</button>
      <button class="btn btn-muted btn-sm" onclick="logout()">Sign out</button>
    </div>
  </header>
  <div id="body-wrap">
    <nav id="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-head" style="display:flex;justify-content:space-between;align-items:center">
          Contacts
          <button class="btn btn-muted btn-sm" onclick="openAddContact()" style="font-size:0.7rem;padding:0.15rem 0.5rem">+ Add</button>
        </div>
        <div id="server-list"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-head">Tags</div>
        <div id="tag-list"></div>
        <button id="clear-tags-btn" onclick="clearTagFilter()" hidden>Clear filter</button>
      </div>
    </nav>
    <div id="main-area">
      <div id="feed-status"></div>
      <div id="timeline"></div>
      <div id="empty-msg" class="empty" hidden>No posts yet.</div>
      <div class="more-row">
        <button id="load-more-btn" class="btn btn-muted" onclick="loadMore()" hidden>Load more</button>
      </div>
    </div>
  </div>
</div>

<!-- ── detail modal ───────────────────────────────────────────────────────── -->
<div id="detail-overlay" class="overlay" hidden onclick="maybeClose('detail-overlay',event)">
  <div class="modal" id="detail-modal">
    <button class="modal-close" onclick="closeDetail()">&#x2715;</button>
    <button class="modal-nav" id="nav-prev" onclick="navigatePost(-1)">&#x2039;</button>
    <button class="modal-nav" id="nav-next" onclick="navigatePost(1)">&#x203A;</button>
    <div id="detail-body"></div>
  </div>
</div>

<!-- ── compose modal ──────────────────────────────────────────────────────── -->
<div id="compose-overlay" class="overlay" hidden onclick="maybeClose('compose-overlay',event)">
  <div class="modal" id="compose-modal">
    <button class="modal-close" onclick="closeCompose()">&#x2715;</button>
    <h3>New post</h3>
    <textarea id="compose-body" placeholder="What's on your mind?"></textarea>
    <div class="drop-zone" id="drop-zone"
         onclick="document.getElementById('file-picker').click()"
         ondragover="dzOver(event)" ondragleave="dzOut(event)" ondrop="dzDrop(event)">
      <div class="drop-zone-icon">&#x1F4CE;</div>
      <div>Attach files — click or drag here</div>
    </div>
    <input type="file" id="file-picker" multiple hidden onchange="pickFiles(this.files);this.value=''">
    <div class="file-list" id="file-list"></div>
    <div class="compose-fields">
      <input type="text" id="compose-tags" placeholder="Tags — space-separated">
      <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.85rem;color:#aaa;cursor:pointer">
        <input type="checkbox" id="compose-public"> Publish (visible to recipients)
      </label>
    </div>
    <div class="upload-progress" id="compose-progress"></div>
    <div style="display:flex;gap:0.5rem;justify-content:flex-end">
      <button class="btn btn-muted" onclick="closeCompose()">Cancel</button>
      <button class="btn btn-primary" id="compose-submit" onclick="submitPost()">Post</button>
    </div>
  </div>
</div>

<!-- ── add contact modal ──────────────────────────────────────────────────── -->
<div id="add-contact-overlay" class="overlay" hidden onclick="maybeClose('add-contact-overlay',event)">
  <div class="modal" style="max-width:400px">
    <button class="modal-close" onclick="closeAddContact()">&#x2715;</button>
    <h3>Add contact</h3>
    <div style="display:flex;flex-direction:column;gap:0.75rem">
      <div style="display:flex;gap:0.5rem">
        <input type="text" id="add-contact-handle" placeholder="username" style="flex:1" onkeydown="if(event.key==='Enter')lookupHandle()">
        <button class="btn btn-muted btn-sm" onclick="lookupHandle()">Look up</button>
      </div>
      <div id="add-contact-result" style="font-size:0.85rem;color:#aaa;min-height:1.4em"></div>
      <div id="add-contact-card" hidden class="contact-profile-card">
        <img id="add-contact-photo" alt="" hidden>
        <div id="add-contact-initials" class="contact-profile-initials" hidden></div>
        <div class="contact-profile-info">
          <div id="add-contact-display-name" class="contact-profile-name"></div>
          <div id="add-contact-handle-display" class="contact-profile-handle"></div>
        </div>
      </div>
      <div id="add-contact-confirm" hidden style="display:flex;flex-direction:column;gap:0.5rem">
        <button class="btn btn-primary" onclick="confirmAddContact()">Add contact</button>
      </div>
      <div id="add-contact-error" style="color:#e06c6c;font-size:0.85rem;min-height:1.2em"></div>
    </div>
  </div>
</div>

<!-- ── profile modal ───────────────────────────────────────────────────────── -->
<div id="profile-overlay" class="overlay" hidden onclick="maybeClose('profile-overlay',event)">
  <div class="modal" style="max-width:400px">
    <button class="modal-close" onclick="closeProfile()">&#x2715;</button>
    <h3>Your profile</h3>
    <div class="profile-modal-photo">
      <img id="profile-modal-photo" alt="" hidden>
      <div id="profile-modal-initials" class="profile-initials-lg" hidden></div>
      <label class="btn btn-muted btn-sm" style="cursor:pointer;margin-top:0.25rem">
        Change photo
        <input type="file" id="profile-photo-input" accept="image/*" hidden onchange="uploadProfilePhoto(this)">
      </label>
    </div>
    <div style="display:flex;flex-direction:column;gap:0.75rem">
      <div style="display:flex;gap:0.5rem">
        <input type="text" id="profile-display-name" placeholder="Display name" style="flex:1">
        <button class="btn btn-primary btn-sm" onclick="saveProfileName()">Save</button>
      </div>
      <div id="profile-status" style="font-size:0.85rem;min-height:1.2em"></div>
      <hr style="border:none;border-top:1px solid #2a2a2a;margin:0.5rem 0">
      <button class="btn btn-muted btn-sm" style="width:100%" onclick="downloadBackup()">Download backup</button>
    </div>
  </div>
</div>

<!-- ── edit modal ─────────────────────────────────────────────────────────── -->
<div id="edit-overlay" class="overlay" hidden onclick="maybeClose('edit-overlay',event)">
  <div class="modal" id="edit-modal" style="min-width:min(90vw,560px)">
    <button class="modal-close" onclick="closeEdit()">&#x2715;</button>
    <h3>Edit post</h3>
    <textarea id="edit-body" style="background:#222;color:#e0e0e0;border:1px solid #333;border-radius:4px;padding:0.6rem;width:100%;font-size:0.95rem;resize:vertical;min-height:100px;outline:none;font-family:inherit;margin-bottom:0.75rem"></textarea>
    <div class="compose-fields">
      <input type="text" id="edit-tags" placeholder="Tags — space-separated">
      <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.85rem;color:#aaa;cursor:pointer">
        <input type="checkbox" id="edit-public"> Publish (visible to recipients)
      </label>
    </div>
    <div class="upload-progress" id="edit-status"></div>
    <div style="display:flex;gap:0.5rem;justify-content:flex-end;margin-top:0.75rem">
      <button class="btn btn-muted" onclick="closeEdit()">Cancel</button>
      <button class="btn btn-primary" id="edit-submit" onclick="submitEdit()">Save</button>
    </div>
  </div>
</div>

<script>
// ── state ──────────────────────────────────────────────────────────────────
let CFG = null;
let activeServer = null;
let activeTags = new Set();
let allPosts = [];
let currentIdx = -1;
let nextCursor = null, currentSearch = null, searchTimer = null;
let pendingFiles = [];
let IS_OWNER = false;
let serverStatuses = {};
let serverHandles = {};
let serverProfiles = {};

// ── client session token ───────────────────────────────────────────────────
function getClientToken() { return localStorage.getItem("contacc_client_session"); }
function setClientToken(t) { localStorage.setItem("contacc_client_session", t); }
function clearClientToken() { localStorage.removeItem("contacc_client_session"); }

function apiHeaders(extra = {}) {
  const t = getClientToken();
  return t ? {"Authorization": "Bearer " + t, ...extra} : extra;
}
async function apiFetch(url, opts = {}) {
  opts.headers = {...apiHeaders(), ...(opts.headers || {})};
  let r = await fetch(url, opts);
  if (r.status === 401) {
    // Session may have been wiped by a server restart — try to re-bootstrap
    const s = await fetch("/client/session", {method: "POST"});
    if (s.ok) {
      setClientToken((await s.json()).token);
      opts.headers = {...apiHeaders(), ...(opts.headers || {})};
      r = await fetch(url, opts);
    }
  }
  return r;
}

function clientTokenParam(hasExistingQuery) {
  const t = getClientToken();
  if (!t) return "";
  return (hasExistingQuery ? "&" : "?") + "client_token=" + encodeURIComponent(t);
}

// ── init ───────────────────────────────────────────────────────────────────
(async function init() {
  await continueInit();
})();

async function continueInit() {
  // Check server setup state before anything else
  try {
    const sr = await fetch("/setup/status");
    if (sr.ok) {
      const ss = await sr.json();
      if (ss.state === "uninitialized") {
        showView("setup");
        const urlToken = new URLSearchParams(location.search).get("setup_token");
        if (urlToken) {
          document.getElementById("setup-token-input").value = urlToken;
          acceptSetupToken();
        }
        return;
      }
      if (ss.state === "locked") { showView("unlock"); return; }
    }
  } catch {}

  let r = await apiFetch("/api/config");
  if (r.status === 401) {
    // Try to bootstrap a session from the stored server owner token
    const s = await fetch("/client/session", {method: "POST"});
    if (s.ok) {
      setClientToken((await s.json()).token);
      r = await apiFetch("/api/config");
    } else {
      if (s.status === 403) {
        document.getElementById("login-error").textContent = "Owner access required.";
      }
      showView("login");
      return;
    }
  }
  CFG = await r.json().catch(() => null);
  if (!CFG) { document.getElementById("login-error").textContent = "Could not load config."; showView("login"); return; }

  document.getElementById("login-server").textContent = CFG.own_server;

  const status = CFG.servers.find(s => s.url === CFG.own_server);
  if (status && status.authenticated) {
    await loadFeed();
  } else {
    showView("login");
  }
}

// ── auth ───────────────────────────────────────────────────────────────────
async function loginGoogle() {
  const r = await fetch("/client/login-url");
  if (!r.ok) { document.getElementById("login-error").textContent = "Login unavailable."; return; }
  window.location.href = (await r.json()).auth_url;
}


async function logout() {
  await apiFetch("/api/auth/token", {method: "DELETE"});
  clearClientToken();
  CFG = null;
  location.reload();
}

async function loadIdentity() {
  const r = await apiFetch("/api/auth/me");
  if (!r.ok) return;
  const d = await r.json();
  IS_OWNER = d.role === "owner";
  document.getElementById("compose-btn").hidden = !IS_OWNER;
  const identity = d.identity || "";
  const nodeR = await fetch("/node");
  const nodeD = nodeR.ok ? await nodeR.json() : {};
  const handle = nodeD.handle || "";
  document.getElementById("handle-display").textContent = handle ? `@${handle}` : "";
  if (handle) document.title = `@${handle}`;
  if (IS_OWNER) {
    loadProfileAvatar();
  }
}

async function loadProfileAvatar() {
  try {
    const r = await apiFetch("/api/profile");
    if (!r.ok) return;
    const p = await r.json();
    const avatarImg = document.getElementById("profile-avatar");
    const avatarInit = document.getElementById("profile-avatar-initials");
    if (p.photo_url) {
      avatarImg.src = p.photo_url + "?t=" + Date.now();
      avatarImg.hidden = false;
      avatarInit.hidden = true;
    } else {
      const name = p.display_name || p.handle || "?";
      avatarInit.textContent = name[0].toUpperCase();
      avatarInit.hidden = false;
      avatarImg.hidden = true;
    }
    document.getElementById("profile-display-name").value = p.display_name || "";
    const modalImg = document.getElementById("profile-modal-photo");
    const modalInit = document.getElementById("profile-modal-initials");
    if (p.photo_url) {
      modalImg.src = p.photo_url + "?t=" + Date.now();
      modalImg.hidden = false;
      modalInit.hidden = true;
    } else {
      const name = p.display_name || p.handle || "?";
      modalInit.textContent = name[0].toUpperCase();
      modalInit.hidden = false;
      modalImg.hidden = true;
    }
  } catch {}
}

// ── views ──────────────────────────────────────────────────────────────────
function showView(name) {
  document.getElementById("setup-view").hidden  = name !== "setup";
  document.getElementById("unlock-view").hidden = name !== "unlock";
  document.getElementById("login-view").hidden  = name !== "login";
  document.getElementById("feed-view").hidden   = name !== "feed";
}

// ── server sidebar ─────────────────────────────────────────────────────────
function renderServerList() {
  const list = document.getElementById("server-list");
  const allBtn = '<button class="server-btn' + (activeServer === null ? " active" : "") + '" onclick="setActiveServer(-1)"><span>All</span></button>';
  const contacts = (CFG.servers || []).filter(s => s.url !== CFG.own_server);
  const serverBtns = contacts.map((s, i) => {
    const globalIdx = (CFG.servers || []).indexOf(s);
    const status = serverStatuses[s.url] || "wait";
    const handle = serverHandles[s.url];
    const label = handle ? `@${handle}` : esc(s.name);
    return '<div class="contact-row">'
      + '<button class="server-btn' + (activeServer === s.url ? " active" : "") + '" onclick="setActiveServer(' + globalIdx + ')" title="' + esc(s.name) + '">'
      + '<span>' + label + '</span>'
      + '<span class="server-dot ' + status + '"></span>'
      + '</button>'
      + '<button class="contact-remove" onclick="removeContact(' + JSON.stringify(s.url).replace(/"/g, '&quot;') + ')" title="Remove contact">✕</button>'
      + '</div>';
  });
  list.innerHTML = allBtn + serverBtns.join("");
}

async function removeContact(url) {
  if (!confirm("Remove this contact?")) return;
  const r = await apiFetch("/api/contacts?" + new URLSearchParams({url}), {method: "DELETE"});
  if (!r.ok) { alert("Failed to remove contact."); return; }
  if (activeServer === url) setActiveServer(-1);
  const cfg = await (await apiFetch("/api/config")).json();
  CFG = cfg;
  renderServerList();
}

async function fetchServerHandles() {
  for (const s of CFG.servers || []) {
    try {
      const nodeUrl = s.url === CFG.own_server ? "/node" : s.url + "/node";
      const r = await fetch(nodeUrl);
      if (r.ok) {
        const d = await r.json();
        if (d.handle) { serverHandles[s.url] = d.handle; renderServerList(); }
      }
    } catch {}
  }
}

async function fetchServerProfiles() {
  const servers = [CFG.own_server, ...(CFG.contacts || []).map(c => c.url)];
  await Promise.all(servers.map(async url => {
    try {
      const r = url === CFG.own_server
        ? await apiFetch("/api/profile")
        : await fetch(url + "/profile");
      if (r.ok) {
        serverProfiles[url] = await r.json();
        serverStatuses[url] = "ok";
        renderServerList();
        document.querySelectorAll(".post-author").forEach(el => {
          if (el.dataset.server === url) _renderAuthorInto(el, url);
        });
      }
    } catch {}
  }));
}

function _authorName(url) {
  const p = serverProfiles[url];
  if (p?.display_name) return p.display_name;
  if (url === CFG.own_server) return "me";
  return (CFG.contacts || []).find(c => c.url === url)?.name || url;
}

function _renderAuthorInto(el, url) {
  const p = serverProfiles[url];
  const name = _authorName(url);
  const handle = p?.handle || serverHandles[url];
  el.title = handle ? `@${handle}` : name;
  el.innerHTML = "";
  if (p?.photo_url) {
    const img = document.createElement("img");
    img.src = p.photo_url;
    img.className = "post-author-avatar";
    img.alt = name;
    el.appendChild(img);
  } else {
    const init = document.createElement("div");
    init.className = "post-author-initials";
    init.textContent = name[0].toUpperCase();
    el.appendChild(init);
  }
  const nameEl = document.createElement("span");
  nameEl.className = "post-author-name";
  nameEl.textContent = name;
  el.appendChild(nameEl);
}

function setActiveServer(i) {
  if (i === -1) {
    activeServer = null;
  } else {
    const url = CFG.servers[i].url;
    activeServer = (activeServer === url) ? null : url;
  }
  renderServerList();
  resetFeed();
}

function filterOwnPosts() {
  activeServer = (activeServer === CFG.own_server) ? null : CFG.own_server;
  renderServerList();
  resetFeed();
}

// ── add contact ────────────────────────────────────────────────────────────
let _pendingContact = null;

function openAddContact() {
  document.getElementById("add-contact-handle").value = "";
  document.getElementById("add-contact-result").textContent = "";
  document.getElementById("add-contact-error").textContent = "";
  document.getElementById("add-contact-confirm").hidden = true;
  document.getElementById("add-contact-overlay").hidden = false;
  document.getElementById("add-contact-handle").focus();
  _pendingContact = null;
}
function closeAddContact() { document.getElementById("add-contact-overlay").hidden = true; }

async function lookupHandle() {
  const handle = document.getElementById("add-contact-handle").value.trim();
  const result = document.getElementById("add-contact-result");
  const card = document.getElementById("add-contact-card");
  const confirm = document.getElementById("add-contact-confirm");
  document.getElementById("add-contact-error").textContent = "";
  card.hidden = true;
  confirm.hidden = true;
  _pendingContact = null;
  if (!handle) return;
  result.textContent = "Looking up…";
  const r = await apiFetch("/api/contacts/lookup?handle=" + encodeURIComponent(handle));
  if (r.status === 404) { result.textContent = "Handle not found."; return; }
  if (!r.ok) { result.textContent = "Lookup failed."; return; }
  const d = await r.json();
  _pendingContact = d;
  result.textContent = "";

  const photoEl = document.getElementById("add-contact-photo");
  const initEl  = document.getElementById("add-contact-initials");
  const nameEl  = document.getElementById("add-contact-display-name");
  const hndlEl  = document.getElementById("add-contact-handle-display");
  const displayName = d.display_name || ("@" + handle);
  nameEl.textContent = displayName;
  hndlEl.textContent = "@" + handle;
  if (d.photo_url) {
    photoEl.src = d.photo_url;
    photoEl.hidden = false;
    initEl.hidden = true;
  } else {
    initEl.textContent = displayName[0].toUpperCase();
    initEl.hidden = false;
    photoEl.hidden = true;
  }
  card.hidden = false;
  confirm.hidden = false;
}

async function confirmAddContact() {
  if (!_pendingContact) return;
  const name = _pendingContact.display_name || _pendingContact.handle;
  const err = document.getElementById("add-contact-error");
  err.textContent = "";
  const r = await apiFetch("/api/contacts", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({name, url: _pendingContact.server_url, handle: _pendingContact.handle || null}),
  });
  if (r.status === 409) { err.textContent = "Already in your contacts."; return; }
  if (!r.ok) { err.textContent = "Failed to add contact."; return; }
  closeAddContact();
  const cfg = await (await apiFetch("/api/config")).json();
  CFG = cfg;
  renderServerList();
  fetchServerHandles();
  fetchServerProfiles();
  resetFeed();
}

// ── tag sidebar ────────────────────────────────────────────────────────────
async function loadTagSidebar() {
  const r = await apiFetch("/api/tags");
  if (!r.ok) return;
  const data = await r.json();
  const list = document.getElementById("tag-list");
  list.innerHTML = (data.tags || []).map(({tag, count}) =>
    '<button class="tag-btn' + (activeTags.has(tag) ? " active" : "") + '" onclick="toggleTag(\'' + esc(tag) + '\')">'
    + '<span>' + esc(tag) + '</span><span class="tc">' + count + '</span></button>'
  ).join("");
}

function toggleTag(tag) {
  if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
  document.getElementById("clear-tags-btn").hidden = activeTags.size === 0;
  document.querySelectorAll(".tag-btn").forEach(b => {
    b.classList.toggle("active", activeTags.has(b.querySelector("span:first-child").textContent));
  });
  resetFeed();
}
function clearTagFilter() {
  activeTags.clear();
  document.getElementById("clear-tags-btn").hidden = true;
  document.querySelectorAll(".tag-btn").forEach(b => b.classList.remove("active"));
  resetFeed();
}

// ── feed ───────────────────────────────────────────────────────────────────
function scheduleSearch(val) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { currentSearch = val.trim() || null; resetFeed(); }, 350);
}

async function loadFeed() {
  showView("feed");
  renderServerList();
  const ok = await resetFeed(true);
  if (!ok) { showView("login"); return false; }
  loadIdentity();
  loadTagSidebar();
  fetchServerHandles();
  fetchServerProfiles();
  return true;
}

async function resetFeed(allowLoginRedirect = false) {
  nextCursor = null; allPosts = []; currentIdx = -1;
  document.getElementById("timeline").innerHTML = "";
  document.getElementById("empty-msg").hidden = true;
  document.getElementById("feed-status").textContent = "";
  return await loadMore(allowLoginRedirect);
}

async function loadMore(allowLoginRedirect = false) {
  let url = "/api/feed?limit=20";
  if (activeServer) url += "&server=" + encodeURIComponent(activeServer);
  if (nextCursor) url += "&cursor=" + encodeURIComponent(nextCursor);
  if (currentSearch) url += "&q=" + encodeURIComponent(currentSearch);
  for (const t of activeTags) url += "&tags=" + encodeURIComponent(t);

  const r = await apiFetch(url);
  if (r.status === 401) { if (allowLoginRedirect) showView("login"); return false; }
  if (!r.ok) return false;

  const data = await r.json();
  const src = activeServer || CFG.own_server;
  serverStatuses[src] = "ok";
  renderServerList();

  const timeline = document.getElementById("timeline");
  for (const post of data.posts) {
    allPosts.push(post);
    timeline.appendChild(makePostCard(post, allPosts.length - 1));
  }
  nextCursor = data.next_cursor || null;
  document.getElementById("load-more-btn").hidden = !nextCursor;
  const n = allPosts.length;
  document.getElementById("feed-status").textContent = n
    ? n + (nextCursor ? "+" : "") + " post" + (n !== 1 ? "s" : "") : "";
  document.getElementById("empty-msg").hidden = n > 0;
  return true;
}

// ── post card ──────────────────────────────────────────────────────────────
function makePostCard(post, idx) {
  const div = document.createElement("div");
  div.className = "post-card";
  div.dataset.idx = idx;
  div.onclick = () => openDetail(idx);

  const author = document.createElement("div");
  author.className = "post-author";
  author.dataset.server = post._server_url;
  _renderAuthorInto(author, post._server_url);
  div.appendChild(author);

  const previewText = (post.body || "").replace(/\[asset:[0-9a-f-]+\]/g, "").trim();
  if (previewText) {
    const p = document.createElement("div");
    p.className = "post-body-preview";
    p.textContent = previewText;
    div.appendChild(p);
  }

  if (post.assets && post.assets.length) {
    const strip = document.createElement("div");
    strip.className = "post-thumbs";
    for (const asset of post.assets) {
      if ((asset.media_type || "").startsWith("image/")) {
        const img = document.createElement("img");
        img.className = "post-thumb loading";
        img.onload = img.onerror = () => img.classList.remove("loading");
        img.alt = ""; img.loading = "lazy";
        // routed through client's proxy API
        const params = post._server_url !== CFG.own_server
          ? "?server=" + encodeURIComponent(post._server_url) : "";
        img.src = "/api/assets/" + asset.id + "/thumb" + params + clientTokenParam(!!params);
        strip.appendChild(img);
      } else {
        const ic = document.createElement("div");
        ic.className = "post-thumb-icon";
        ic.textContent = mimeIcon(asset.media_type);
        strip.appendChild(ic);
      }
    }
    div.appendChild(strip);
  }

  const foot = document.createElement("div");
  foot.className = "post-foot";
  const tagHtml = (post.tags || []).map(t =>
    '<span class="tag-chip' + (activeTags.has(t) ? " active" : "") + '">' + esc(t) + '</span>'
  ).join("");
  const dateFmt = post.created_at ? new Date(post.created_at * 1000).toLocaleDateString() : "";
  foot.innerHTML = tagHtml + '<span class="post-date" style="margin-left:auto">' + dateFmt + '</span>';
  div.appendChild(foot);
  return div;
}

// ── keyboard nav ───────────────────────────────────────────────────────────
document.addEventListener("keydown", e => {
  if (!document.getElementById("detail-overlay").hidden) {
    if (e.key === "Escape") { closeDetail(); return; }
    if (e.key === "ArrowLeft"  || e.key === "ArrowUp")   { e.preventDefault(); navigatePost(-1); }
    if (e.key === "ArrowRight" || e.key === "ArrowDown")  { e.preventDefault(); navigatePost(1);  }
  }
  if (!document.getElementById("compose-overlay").hidden && e.key === "Escape") closeCompose();
  if (!document.getElementById("edit-overlay").hidden && e.key === "Escape") closeEdit();
  if (!document.getElementById("profile-overlay").hidden && e.key === "Escape") closeProfile();
  if (!document.getElementById("add-contact-overlay").hidden && e.key === "Escape") closeAddContact();
});

function navigatePost(delta) {
  const next = currentIdx + delta;
  if (next < 0 || next >= allPosts.length) return;
  openDetail(next);
  if (next >= allPosts.length - 3 && nextCursor) loadMore();
}

function highlightCard(idx) {
  document.querySelectorAll(".post-card.active-card").forEach(c => c.classList.remove("active-card"));
  const card = document.querySelector(".post-card[data-idx='" + idx + "']");
  if (card) card.classList.add("active-card");
}

// ── detail modal ───────────────────────────────────────────────────────────
let currentPostId = null, currentPostServer = null;

function renderPostBody(post) {
  const assetMap = {};
  for (const a of (post.assets || [])) assetMap[a.id] = a;
  const parts = (post.body || "").split(/(\[asset:[0-9a-f-]+\])/);
  let rendered = "";
  for (const part of parts) {
    const m = part.match(/^\[asset:([0-9a-f-]+)\]$/);
    if (m) {
      const aid = m[1], a = assetMap[aid];
      const params = post._server_url !== CFG.own_server
        ? "?server=" + encodeURIComponent(post._server_url) : "";
      const url = "/api/assets/" + aid + params + clientTokenParam(!!params);
      if (a && (a.media_type || "").startsWith("image/"))
        rendered += '<span class="asset-block"><img src="' + url + '" alt=""></span>';
      else if (a && (a.media_type || "").startsWith("video/"))
        rendered += '<span class="asset-block"><video src="' + url + '" controls></video></span>';
      else {
        const label = (a && a.title) ? a.title : aid.slice(0, 8) + "…";
        rendered += '<span class="asset-block"><a class="asset-file" href="' + url + '" download>' + mimeIcon(a && a.media_type) + ' ' + esc(label) + '</a></span>';
      }
    } else { rendered += esc(part); }
  }
  return rendered;
}

function openDetail(idx) {
  currentIdx = idx;
  const post = allPosts[idx];
  currentPostId = post.id;
  currentPostServer = post._server_url;
  highlightCard(idx);
  renderDetail(post);
  document.getElementById("nav-prev").hidden = idx <= 0;
  document.getElementById("nav-next").hidden = idx >= allPosts.length - 1;
  document.getElementById("detail-overlay").hidden = false;
  loadComments(post);
}

function renderDetail(post) {
  const tagHtml = (post.tags || []).map(t =>
    '<button class="tag-chip' + (activeTags.has(t) ? " active" : "") + '" onclick="toggleTag(\'' + esc(t) + '\')">' + esc(t) + '</button>'
  ).join("");
  const dateFmt = post.created_at ? new Date(post.created_at * 1000).toLocaleString(undefined, {dateStyle:"short",timeStyle:"short"}) : "";
  const srcLine = post._server_name && post._server_name !== "me"
    ? '<div style="font-size:0.78rem;color:#555;margin-bottom:0.4rem">' + esc(post._server_name) + '</div>'
    : "";
  const ownerControls = IS_OWNER && post._server_url === CFG.own_server
    ? '<div style="display:flex;gap:0.5rem;margin-top:0.75rem">'
      + '<button class="btn btn-muted btn-sm" onclick="openEdit(' + currentIdx + ')">Edit</button>'
      + '<button class="btn btn-sm" style="background:#5a1f1f;color:#e06c6c" onclick="confirmDelete(' + currentIdx + ')">Delete</button>'
      + '</div>'
    : "";
  document.getElementById("detail-body").innerHTML =
    srcLine
    + '<div class="post-detail-body">' + renderPostBody(post) + '</div>'
    + '<div class="modal-meta">'
    + (tagHtml ? '<div style="margin-top:0.4rem">' + tagHtml + '</div>' : '')
    + '<div style="margin-top:0.4rem">' + dateFmt + '</div>'
    + '</div>'
    + ownerControls
    + '<div id="comments-section" class="comments"><div class="comments-header" style="color:#555">Loading…</div></div>';
}

function closeDetail() {
  document.getElementById("detail-overlay").hidden = true;
  highlightCard(-1);
  currentIdx = -1; currentPostId = null; currentPostServer = null;
}

// ── comments ───────────────────────────────────────────────────────────────
async function loadComments(post) {
  const params = post._server_url !== CFG.own_server
    ? "?server=" + encodeURIComponent(post._server_url) : "";
  const r = await apiFetch("/api/posts/" + post.id + "/comments" + params);
  const section = document.getElementById("comments-section");
  if (!section || currentPostId !== post.id) return;
  if (!r.ok) { section.innerHTML = ""; return; }
  renderComments(post, (await r.json()).comments);
}

function renderComments(post, comments) {
  const section = document.getElementById("comments-section");
  if (!section) return;
  const live = comments.filter(c => !c.deleted);
  const byParent = {};
  for (const c of live) { const k = c.parent_id || "__root__"; (byParent[k] = byParent[k] || []).push(c); }
  function renderOne(c, depth) {
    const replies = byParent[c.id] || [];
    return '<div class="comment">'
      + '<div class="comment-author">' + esc(c.author_identity || "owner") + '</div>'
      + '<div class="comment-body">' + esc(c.body) + '</div>'
      + '<div class="comment-foot">' + fmtDate(c.created_at) + '</div>'
      + (replies.length ? '<div class="comment-replies">' + replies.map(r => renderOne(r, depth+1)).join("") + '</div>' : '')
      + '</div>';
  }
  const roots = byParent["__root__"] || [];
  const count = live.length;
  const serverParam = post._server_url !== CFG.own_server
    ? "?server=" + encodeURIComponent(post._server_url) : "";
  section.innerHTML =
    '<div class="comments-header">' + count + ' comment' + (count !== 1 ? 's' : '') + '</div>'
    + roots.map(c => renderOne(c, 0)).join("")
    + '<div class="comment-form">'
    + '<textarea id="comment-input" placeholder="Add a comment…"></textarea>'
    + '<div class="comment-form-footer"><button class="btn btn-primary btn-sm" onclick="submitComment(\'' + post.id + '\',\'' + esc(post._server_url) + '\')">Post</button></div>'
    + '</div>';
}

async function submitComment(postId, serverUrl) {
  const input = document.getElementById("comment-input");
  const body = input ? input.value.trim() : "";
  if (!body) return;
  const params = serverUrl !== CFG.own_server ? "?server=" + encodeURIComponent(serverUrl) : "";
  const r = await apiFetch("/api/posts/" + postId + "/comments" + params, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({body}),
  });
  if (r.ok) { loadComments(allPosts[currentIdx]); }
}

// ── compose ────────────────────────────────────────────────────────────────
function openCompose() {
  pendingFiles = [];
  document.getElementById("compose-body").value = "";
  document.getElementById("compose-tags").value = "";
  document.getElementById("compose-public").checked = false;
  document.getElementById("compose-progress").innerHTML = "";
  document.getElementById("compose-submit").disabled = false;
  document.getElementById("file-list").innerHTML = "";
  document.getElementById("compose-overlay").hidden = false;
  document.getElementById("compose-body").focus();
}
function closeCompose() { document.getElementById("compose-overlay").hidden = true; }
function dzOver(e) { e.preventDefault(); document.getElementById("drop-zone").classList.add("over"); }
function dzOut()   { document.getElementById("drop-zone").classList.remove("over"); }
function dzDrop(e) { e.preventDefault(); dzOut(); addFiles(e.dataTransfer.files); }
function pickFiles(files) { addFiles(files); }
function addFiles(files) {
  for (const f of files) pendingFiles.push(f);
  document.getElementById("file-list").innerHTML = pendingFiles.map(f =>
    '<div class="file-item"><span>' + esc(f.name) + '</span><span>' + fmtSize(f.size) + '</span></div>'
  ).join("");
}

async function submitPost() {
  const bodyText = document.getElementById("compose-body").value.trim();
  if (!bodyText && !pendingFiles.length) return;
  const tags = document.getElementById("compose-tags").value.trim().split(/\s+/).filter(Boolean);
  const prog = document.getElementById("compose-progress");
  document.getElementById("compose-submit").disabled = true;
  prog.innerHTML = '<div class="progress-item">Posting…</div>';

  const fd = new FormData();
  fd.append("body", bodyText);
  fd.append("tags", JSON.stringify(tags));
  fd.append("public", document.getElementById("compose-public").checked ? "true" : "false");
  for (const f of pendingFiles) fd.append("files", f);

  try {
    const r = await apiFetch("/api/posts", {method: "POST", body: fd});
    if (r.ok) {
      const post = await r.json();
      prependPost(post);
      loadTagSidebar();
      prog.innerHTML = '<div class="progress-item progress-ok">&#x2713; Posted</div>';
      pendingFiles = [];
      document.getElementById("file-list").innerHTML = "";
      setTimeout(closeCompose, 900);
    } else {
      prog.innerHTML = '<div class="progress-item progress-err">&#x2717; Error ' + r.status + '</div>';
      document.getElementById("compose-submit").disabled = false;
    }
  } catch {
    prog.innerHTML = '<div class="progress-item progress-err">&#x2717; Network error</div>';
    document.getElementById("compose-submit").disabled = false;
  }
}

function prependPost(post) {
  allPosts.unshift(post);
  document.querySelectorAll(".post-card[data-idx]").forEach(c => c.dataset.idx = parseInt(c.dataset.idx) + 1);
  const timeline = document.getElementById("timeline");
  timeline.insertBefore(makePostCard(post, 0), timeline.firstChild);
  document.getElementById("empty-msg").hidden = true;
}

// ── edit / delete ──────────────────────────────────────────────────────────
let editingIdx = -1;

function openEdit(idx) {
  editingIdx = idx;
  const post = allPosts[idx];
  document.getElementById("edit-body").value = post.body || "";
  document.getElementById("edit-tags").value = (post.tags || []).join(" ");
  document.getElementById("edit-public").checked = !!post.public;
  document.getElementById("edit-status").innerHTML = "";
  document.getElementById("edit-submit").disabled = false;
  document.getElementById("edit-overlay").hidden = false;
}
function closeEdit() { document.getElementById("edit-overlay").hidden = true; }

async function submitEdit() {
  const post = allPosts[editingIdx];
  const body = document.getElementById("edit-body").value;
  const tags = document.getElementById("edit-tags").value.trim().split(/\s+/).filter(Boolean);
  const pub  = document.getElementById("edit-public").checked;
  document.getElementById("edit-submit").disabled = true;
  document.getElementById("edit-status").innerHTML = '<span style="color:#aaa">Saving…</span>';

  const r = await apiFetch("/api/posts/" + post.id, {
    method: "PATCH",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({body, tags, public: pub}),
  });
  if (r.ok) {
    const updated = await r.json();
    updated._server_url = post._server_url;
    updated._server_name = post._server_name;
    allPosts[editingIdx] = updated;
    const card = document.querySelector(".post-card[data-idx='" + editingIdx + "']");
    if (card) card.replaceWith(makePostCard(updated, editingIdx));
    closeEdit();
    if (currentIdx === editingIdx) renderDetail(updated);
  } else {
    document.getElementById("edit-status").innerHTML = '<span style="color:#e06c6c">Save failed.</span>';
    document.getElementById("edit-submit").disabled = false;
  }
}

async function confirmDelete(idx) {
  const post = allPosts[idx];
  if (!confirm("Delete this post? This cannot be undone.")) return;
  const r = await apiFetch("/api/posts/" + post.id, {method: "DELETE"});
  if (r.ok || r.status === 204) {
    allPosts.splice(idx, 1);
    document.querySelectorAll(".post-card[data-idx]").forEach(c => {
      const i = parseInt(c.dataset.idx);
      if (i === idx) c.remove();
      else if (i > idx) c.dataset.idx = i - 1;
    });
    if (currentIdx === idx) { closeDetail(); }
    else if (currentIdx > idx) { currentIdx--; }
    document.getElementById("empty-msg").hidden = allPosts.length > 0;
    loadTagSidebar();
  }
}

// ── utilities ──────────────────────────────────────────────────────────────
function maybeClose(id, e) { if (e.target === document.getElementById(id)) document.getElementById(id).hidden = true; }
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function mimeIcon(mt) {
  if (!mt) return "📄";
  if (mt.startsWith("video/")) return "🎬";
  if (mt.startsWith("audio/")) return "🎵";
  if (mt === "application/pdf") return "📋";
  return "📄";
}
function fmtDate(ts) { if (!ts) return ""; return new Date(ts * 1000).toLocaleString(undefined, {dateStyle:"short",timeStyle:"short"}); }
function fmtSize(b) { if (b < 1024) return b + " B"; if (b < 1048576) return (b/1024).toFixed(1) + " KB"; return (b/1048576).toFixed(1) + " MB"; }

// ── profile ────────────────────────────────────────────────────────────────
function openProfile() { loadProfileAvatar(); document.getElementById("profile-overlay").hidden = false; }
function closeProfile() { document.getElementById("profile-overlay").hidden = true; }

function downloadBackup() {
  window.location.href = "/api/backup" + clientTokenParam(false);
}

async function saveProfileName() {
  const name = document.getElementById("profile-display-name").value.trim();
  const status = document.getElementById("profile-status");
  if (!name) { status.style.color = "#e06c6c"; status.textContent = "Name required."; return; }
  status.style.color = "#888"; status.textContent = "Saving…";
  const r = await apiFetch("/api/profile", {
    method: "PUT",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({display_name: name}),
  });
  if (r.ok) {
    loadProfileAvatar();
    closeProfile();
  } else {
    status.style.color = "#e06c6c"; status.textContent = "Failed to save.";
  }
}

async function uploadProfilePhoto(input) {
  const file = input.files[0];
  if (!file) return;
  const status = document.getElementById("profile-status");
  status.style.color = "#888"; status.textContent = "Uploading…";
  const fd = new FormData();
  fd.append("file", file);
  const r = await apiFetch("/api/profile/photo", {method: "PUT", body: fd});
  if (r.ok) {
    status.style.color = "#6dbf6d"; status.textContent = "Photo updated.";
    loadProfileAvatar();
    setTimeout(() => { status.textContent = ""; }, 2000);
  } else {
    status.style.color = "#e06c6c"; status.textContent = "Upload failed.";
  }
  input.value = "";
}

// ── setup / unlock ─────────────────────────────────────────────────────────

let _setupToken = null;
let _handleCheckTimer = null;
let _handleAvailable = false;
let restoreFile = null;

function acceptSetupToken() {
  const token = document.getElementById("setup-token-input").value.trim();
  const err = document.getElementById("setup-token-error");
  if (!token) { err.textContent = "Token required."; return; }
  _setupToken = token;
  document.getElementById("setup-token-step").hidden = true;
  document.getElementById("setup-wizard-step").hidden = false;
}

function showSetupTab(tab) {
  document.getElementById("setup-new-form").hidden = tab !== "new";
  document.getElementById("setup-restore-form").hidden = tab !== "restore";
  document.getElementById("tab-new").classList.toggle("active", tab === "new");
  document.getElementById("tab-restore").classList.toggle("active", tab === "restore");
}

function checkHandleAvailability() {
  const handle = document.getElementById("setup-handle").value.trim();
  const status = document.getElementById("setup-handle-status");
  _handleAvailable = false;
  clearTimeout(_handleCheckTimer);
  if (!handle) { status.textContent = ""; return; }
  status.style.color = "#888";
  status.textContent = "Checking…";
  _handleCheckTimer = setTimeout(async () => {
    try {
      const r = await fetch("/setup/check-handle?handle=" + encodeURIComponent(handle));
      const d = await r.json();
      if (r.ok) {
        status.style.color = "#6dbf6d";
        status.textContent = `✓ '${handle}' is available`;
        _handleAvailable = true;
      } else {
        status.style.color = "#e06c6c";
        status.textContent = d.detail || "Handle unavailable";
        _handleAvailable = false;
      }
    } catch { status.style.color = "#888"; status.textContent = "Could not check availability"; }
  }, 400);
}

function restoreFileSelected(input) {
  restoreFile = input.files[0] || null;
  document.getElementById("restore-filename").textContent = restoreFile ? restoreFile.name : "";
}

function _badSetupToken(msg) {
  _setupToken = null;
  document.getElementById("setup-wizard-step").hidden = true;
  document.getElementById("setup-token-step").hidden = false;
  document.getElementById("setup-token-error").textContent = msg || "Invalid setup token.";
}

async function doSetupNew() {
  const email = document.getElementById("setup-owner-email").value.trim();
  const handle = document.getElementById("setup-handle").value.trim();
  const pass = document.getElementById("setup-passphrase").value;
  const confirm = document.getElementById("setup-passphrase-confirm").value;
  const err = document.getElementById("setup-new-error");
  err.textContent = "";
  if (!email || !handle || !pass) { err.textContent = "All fields required."; return; }
  if (!_handleAvailable) { err.textContent = "Please choose an available handle."; return; }
  if (pass !== confirm) { err.textContent = "Passphrases do not match."; return; }
  try {
    const r = await fetch("/setup/new", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({passphrase: pass, confirm_passphrase: confirm, owner_identity: "google:" + email, setup_token: _setupToken, handle}),
    });
    const d = await r.json();
    if (r.status === 403) { _badSetupToken(d.detail); return; }
    if (!r.ok) { err.textContent = d.detail || "Error."; return; }
    location.reload();
  } catch { err.textContent = "Network error."; }
}

async function doSetupRestore() {
  const pass = document.getElementById("restore-passphrase").value;
  const err = document.getElementById("setup-restore-error");
  err.textContent = "";
  if (!restoreFile) { err.textContent = "Please select a backup file."; return; }
  if (!pass) { err.textContent = "Passphrase required."; return; }
  const fd = new FormData();
  fd.append("bundle", restoreFile);
  fd.append("passphrase", pass);
  fd.append("setup_token", _setupToken || "");
  try {
    const r = await fetch("/setup/restore", {method: "POST", body: fd});
    const d = await r.json();
    if (r.status === 403) { _badSetupToken(d.detail); return; }
    if (!r.ok) { err.textContent = d.detail || "Error."; return; }
    location.reload();
  } catch { err.textContent = "Network error."; }
}

async function doUnlock() {
  const pass = document.getElementById("unlock-passphrase").value;
  const err = document.getElementById("unlock-error");
  err.textContent = "";
  try {
    const r = await fetch("/setup/unlock", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({passphrase: pass}),
    });
    const d = await r.json();
    if (!r.ok) { err.textContent = d.detail || "Wrong passphrase."; return; }
    location.reload();
  } catch { err.textContent = "Network error."; }
}
